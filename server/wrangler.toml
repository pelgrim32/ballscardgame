name = "balls-server"
main = "dist/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

[[durable_objects.bindings]]
name = "TABLE"
class_name = "Table"

[[durable_objects.bindings]]
name = "LOBBY"
class_name = "Lobby"

[[durable_objects.bindings]]
name = "ACCOUNTS"
class_name = "Accounts"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Table", "Lobby"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["Accounts"]
