/* Layout: one-screen game table — opponents across the top, deck + throw pile in the centre, your hand docked at the bottom.
   Single committed look: pixel-arcade table (swirling dark felt, chunky flat panels, hard pixel shadows, sprite suits). */
:root{
  --bg:#1f4a45; --bg-deep:#102624; --swirl-a:#2c6a5e; --swirl-b:#6e2b35;
  --panel:#2c3a3f; --panel-hi:#3d5058; --panel-lo:#172025; --line:#55707a;
  --ink:#ffffff; --ink-dim:#b7c9cc;
  --red:#fe5f55; --red-lo:#a8322b; --blue:#009dff; --blue-lo:#00609c; --orange:#fda200; --orange-lo:#a86b00; --green:#4bc292; --gold:#f5c34b;
  --card:#f3efe4; --card-edge:#c9c0ad; --card-red:#e5484d; --card-dark:#33395c;
  --px:"BalatroPx","Pixelify Sans","Courier New",ui-monospace,monospace;
  --cw:clamp(62px,18.5vw,108px); --ch:calc(var(--cw)*1.4);
  color-scheme:dark;
}
html,body,#app{height:100%}
body{background:var(--bg-deep);color:var(--ink);font-family:var(--px);font-weight:400;font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none}
.fx{position:fixed;inset:-30%;z-index:-2;background:
  repeating-conic-gradient(from 0deg at 50% 50%,var(--swirl-a) 0deg 14deg,var(--bg) 14deg 30deg,var(--swirl-b) 30deg 36deg,var(--bg) 36deg 60deg);
  filter:blur(28px) saturate(1.1);opacity:.55;animation:swirl 60s linear infinite}
.fx2{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%),
  repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
@keyframes swirl{to{transform:rotate(360deg)}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:10px;max-width:900px;margin:0 auto}
svg.spr{shape-rendering:crispEdges;display:block}

/* ---------- home ---------- */
.home{justify-content:flex-start;align-items:center;overflow-y:auto}
.home>:first-child{margin-top:auto}.home>:last-child{margin-bottom:auto}
.logo{font-family:var(--px);font-weight:700;font-size:clamp(60px,18vw,112px);line-height:.9;color:var(--ink);text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--panel-lo);letter-spacing:.02em;margin:18px 0 6px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(-1deg)}}
.tag{color:var(--ink-dim);text-align:center;max-width:32ch;margin:0;font-size:15px;line-height:1.35}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;box-sizing:border-box;box-shadow:0 5px 0 var(--panel-lo)}
.panel h2{font-weight:700;font-size:20px;margin:0;letter-spacing:.04em;text-transform:uppercase}
label.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim)}
input.txt{width:100%;box-sizing:border-box;background:var(--panel-lo);border:3px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-weight:600;color:var(--ink);font-size:17px}
input.txt::placeholder{color:rgba(255,255,255,.35)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;padding:10px 18px;border-radius:8px;background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-lo);text-shadow:2px 2px 0 rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s,opacity .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-lo)}
.btn.alt{background:var(--blue);box-shadow:0 5px 0 var(--blue-lo)}
.btn.alt:active{box-shadow:0 1px 0 var(--blue-lo)}
.btn.ghost{background:var(--panel-hi);box-shadow:0 5px 0 var(--panel-lo)}
.btn.ghost:active{box-shadow:0 1px 0 var(--panel-lo)}
.btn[disabled]{opacity:.35;pointer-events:none}
.grow{flex:1}
.seg{display:flex;gap:6px}
.seg.wrap{flex-wrap:wrap;justify-content:flex-end;max-width:260px}
.seg.wrap button{height:36px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:15px}
.rgrid select,.rgrid input[type=number]{font:inherit;font-size:15px;color:var(--ink);background:var(--panel-lo);border:2px solid var(--line);border-radius:6px;padding:5px 8px}
.rgrid input[type=number]{width:3.6em;padding:4px 6px}
.rgrid select:disabled,.rgrid input:disabled{opacity:.7}
.rgrid input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px;vertical-align:-3px}
.rgrid .switch{display:flex;align-items:center;gap:6px;justify-self:end;font-size:13px;color:var(--ink-dim)}
.rreset-n{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-dim);justify-self:end}
.ttimer{display:inline-block;font-size:.7em;padding:2px 7px;border-radius:6px;background:var(--panel-lo);color:var(--ink);vertical-align:3px}
.ttimer.low{background:var(--red);color:#fff}
.seg button{width:40px;height:40px;border-radius:8px;background:var(--panel-lo);border:3px solid var(--line);font-weight:700;font-size:18px}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);box-shadow:0 3px 0 var(--red-lo)}
.note{font-size:14px;color:var(--ink-dim);margin:0;line-height:1.35}
.err{color:var(--red);font-size:14px;margin:0}
details.rules{width:100%;max-width:380px}
details.rules summary{cursor:pointer;font-weight:700;font-size:18px;padding:8px 0;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
details.rules ul{margin:4px 0 0;padding-left:18px;color:var(--ink-dim);line-height:1.45;font-size:15px}
details.rules b{color:var(--ink)}

/* ---------- lobby ---------- */
.code{font-weight:700;font-size:50px;letter-spacing:.16em;color:var(--gold);text-align:center;line-height:1;text-shadow:3px 3px 0 var(--panel-lo)}
.plist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;gap:10px;background:var(--panel-lo);border-radius:8px;padding:8px 10px}
.av{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.plist .x{margin-left:auto;font-size:13px;color:var(--ink-dim);padding:4px 8px}

/* ---------- game ---------- */
.top{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dim)}
.top .pill,.top .icon{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--panel-lo)}
.top .icon{color:var(--ink)}

.table{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(18px,7vw,60px);position:relative}

.deck .card:nth-child(2){transform:translate(-3px,-3px)}
.deck .card:nth-child(3){transform:translate(-6px,-6px)}
.availrow{display:flex;min-height:var(--ch);align-items:center}
.availrow .card{margin-left:calc(var(--cw)*-.55);transform:rotate(var(--rot,0deg))}
.availrow .card:first-child{margin-left:0}

/* ---------- motion: flying cards and action bubbles ---------- */
.flyer{position:fixed;left:0;top:0;z-index:15;pointer-events:none;will-change:transform}
.flyer .card{margin:0!important;animation:none!important;transform:none!important}
.bubble{position:fixed;z-index:16;pointer-events:none;transform:translate(-50%,-100%);background:var(--panel-lo);border:2px solid var(--gold);color:var(--ink);font-weight:700;font-size:13px;padding:4px 8px;border-radius:7px;white-space:nowrap;box-shadow:0 3px 0 rgba(0,0,0,.4);animation:bub 2.2s ease-out forwards}

/* ---------- placings + round countdown ---------- */
.rank{display:inline-block;font-size:11px;font-weight:700;line-height:1;padding:3px 6px;border-radius:5px;background:var(--panel-lo);color:var(--ink-dim);letter-spacing:.03em;vertical-align:1px}

.rank.r3{background:#d08a4e;color:#2a1405}
.total .rank{display:block;margin:3px auto 0;width:max-content;text-transform:none;font-size:11px;letter-spacing:.03em}
.rrow .who .rank{margin-right:4px}
.countdown{position:fixed;inset:0;z-index:25;display:grid;place-items:center;background:rgba(5,15,15,.72);pointer-events:none;transition:opacity .3s}
.countdown.out{opacity:0}
.cd-box{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.cd-round{font-weight:700;font-size:clamp(34px,10vw,64px);letter-spacing:.06em;text-transform:uppercase;color:var(--ink);text-shadow:3px 3px 0 var(--red),6px 6px 0 var(--panel-lo)}

.cd-num.pop{animation:cdpop .6s steps(6,end)}
@keyframes cdpop{0%{transform:scale(1.8);opacity:0}30%{transform:scale(.92);opacity:1}100%{transform:scale(1)}}
.cd-sub{font-size:16px;color:var(--ink-dim)}

.ui-felt .cd-round{color:#ffcf2e;text-shadow:0 4px 0 #e8302a,0 8px 0 #151515}

<script>

/* ================= ENGINE ================= */

function deriveRules(r){

let RULES = deriveRules(null);

function cardsNeeded(r,n){ const R=deriveRules(r); return {need:n*R.startHand+1, have:R.decks*(52+R.jokers)}; }

const fullDeck = () => { const d=[];
  for(let k=0;k<RULES.decks;k++){ const sfx=k?'#'+(k+1):''; for (const s of SUITS) for (const r of RANKS) d.push(s+'-'+r+sfx); for (let i=1;i<=RULES.jokers;i++) d.push('X-'+(k*4+i)); }
  return d; };
const rank = c => c[0]==='X' ? 'X' : c.slice(2).split('#')[0];
const suit = c => c[0];
function val(c){ const r=rank(c); if(r==='X')return RULES.jokerVal; if(r==='J')return RULES.jackVal; if(r==='A')return 1; if(r==='Q'||r==='K')return 10; return +r; }
const handVal = h => (h||[]).reduce((a,c)=>a+val(c),0);
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
const validThrow = cs => cs.length===1 || (cs.length>=2 && cs.every(c=>rank(c)===rank(cs[0])));
const aliveList = s => s.players.filter(p=>!p.out);
function nextAlive(s,i){ const n=s.players.length; for(let k=1;k<=n;k++){const j=(i+k)%n; if(!s.players[j].out) return j;} return i; }

function placings(s){
  const alive=s.players.filter(p=>!p.out), m={};
  for(const p of alive) m[p.id]=1+alive.filter(q=>q.score<p.score).length;
  return m;
}
function ordinal(n){ const v=n%100; return n+(v>=11&&v<=13?'th':({1:'st',2:'nd',3:'rd'}[n%10]||'th')); }

function startRound(s){
  s.round=(s.round||0)+1;
  const deck=shuffle(fullDeck());
  s.hands={}; s.turnsTaken={};
  for(const p of s.players){ if(p.out) continue; s.hands[p.id]=deck.splice(0,RULES.startHand); s.turnsTaken[p.id]=0; }

function canCall(s,id){ return s.phase==='play' && roundLive(s) && s.step==='throw' && s.players[s.turn].id===id && handVal(s.hands[id])<=RULES.callMax && (s.turnsTaken[id]||0)>0; }
const roundLive = s => !s.startAt || Date.now() >= s.startAt;
function isTurn(s,id){ return s.phase==='play' && roundLive(s) && s.players[s.turn] && s.players[s.turn].id===id; }

function doThrow(s,id,cards){
  if(!isTurn(s,id)||s.step!=='throw') return 'It is not your throw.';
  const h=s.hands[id];
  if(!cards.length||!cards.every(c=>h.includes(c))) return 'Pick cards from your hand.';
  if(!validThrow(cards)) return 'Throw one card, or two or more of the same rank.';
  s.hands[id]=h.filter(c=>!cards.includes(c));
  s.thrown=cards; s.step='draw';
}
function doDraw(s,id,src,card){
  if(!isTurn(s,id)||s.step!=='draw') return 'Throw first, then grab a card.';
  let c;
  if(src==='deck'){
    if(!s.deck.length){ s.deck=shuffle(s.pile); s.pile=[]; }
    if(!s.deck.length) return 'The deck is empty. Take a card from the table.';
    c=s.deck.pop();
  } else {
    if(!s.avail.includes(card)) return 'That card is no longer on the table.';
    c=card; s.avail=s.avail.filter(x=>x!==card);
  }
  s.hands[id].push(c);
  const thrownTxt=s.thrown.map(label).join(' ');
  addLog(s,`${pname(s,id)} threw ${thrownTxt} · ${src==='deck'?'drew from the deck':'took '+label(c)+' from the last throw'}`);

  const vals={}; for(const p of aliveList(s)) vals[p.id]=handVal(s.hands[p.id]);

}

  const groups={}; for(const c of h){ (groups[rank(c)]=groups[rank(c)]||[]).push(c); }

  Q:'<svg viewBox="0 0 100 70" aria-hidden="true"><path d="M16 60 Q22 34 30 30 Q40 44 50 22 Q60 44 70 30 Q78 34 84 60Z" fill="var(--c)"/><circle cx="30" cy="27" r="5" fill="#d9a521"/><circle cx="50" cy="18" r="7" fill="#d9a521"/><circle cx="70" cy="27" r="5" fill="#d9a521"/><path d="M14 58 H86 V66 H14Z" fill="#d9a521"/><path d="M44 46 L50 38 L56 46 L50 54Z" fill="#fffdf7"/></svg>',
  J:'<svg viewBox="0 0 100 70" aria-hidden="true"><path d="M18 60 Q20 30 50 28 Q80 30 82 60Z" fill="var(--c)"/><path d="M14 58 H86 V66 H14Z" fill="#d9a521"/><path d="M58 30 Q74 8 92 6 Q82 18 66 34Z" fill="#d9a521"/><path d="M62 30 Q74 14 88 10" stroke="var(--c)" stroke-width="1.5" fill="none"/></svg>'
};
/* pixel joker: the smooth jester rasterised onto a coarse grid, alpha snapped to hard edges */
const PXJ={}, PXJ_W=36, PXJ_H=43;
function pixelJoker(n){ return PXJ[n%2]||null; }
function buildPixelJokers(){
  return Promise.all([1,2].map(n=>new Promise(res=>{
    try{
      const svg=jokerArt(n,false).replace('<svg ','<svg xmlns="http://www.w3.org/2000/svg" width="100" height="120" ');
      const img=new Image();
      img.onload=()=>{ try{
        const c=document.createElement('canvas'); c.width=PXJ_W; c.height=PXJ_H;
        const x=c.getContext('2d'); x.imageSmoothingEnabled=true; x.drawImage(img,0,0,PXJ_W,PXJ_H);
        const d=x.getImageData(0,0,PXJ_W,PXJ_H); for(let i=3;i<d.data.length;i+=4) d.data[i]=d.data[i]<128?0:255; x.putImageData(d,0,0);
        PXJ[n%2]=c.toDataURL('image/png'); }catch(e){} res(); };
      img.onerror=()=>res();
      img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
    }catch(e){ res(); }
  })));
}
function unoCard(c,cls,attrs){
  if(c==='back') return `<div class="card back ${cls}" ${attrs}><div class="face"><div class="oval"><div class="big">BALLS</div></div></div></div>`;
  const r=rank(c);
  if(r==='X') return `<div class="card joker ${cls}" ${attrs}><div class="face"><span class="ci tl">★</span><div class="oval"><div class="big">★<em>25</em></div></div><span class="ci br">★</span></div></div>`;
  const s=suit(c);
  return `<div class="card su-${s} ${cls}" ${attrs}><div class="face"><span class="ci tl">${r}</span><div class="oval"><div class="big">${r}<em>${SYM[s]}</em></div></div><span class="ci br">${r}</span></div></div>`;
}
function cardHTML(c,{cls='',attrs=''}={}){
  if(skin==='uno') return unoCard(c,cls,attrs);
  if(c==='back') return `<div class="card back ${cls}" ${attrs}><div class="lattice"></div></div>`;
  const r=rank(c), classic=['classic','neon','sketch'].includes(skin);
  if(r==='X'){
    const n=+c.slice(2);
    const word='J<br>O<br>K<br>E<br>R';
    if(classic) return `<div class="card joker ${cls}" ${attrs}><span class="idx tl">${word}</span><div class="art">${jokerArt(n)}</div><span class="idx br">${word}</span></div>`;
    const px=pixelJoker(n);
    return `<div class="card joker ${cls}" ${attrs}><span class="idx tl">${word}</span><div class="art px">${px?`<img src="${px}" alt="">`:jokerArt(n,false)}</div><span class="idx br">${word}</span></div>`;
  }
  const s=suit(c), col=(s==='H'||s==='D')?'red':'';
  if(classic){
    const sym=SYM[s], idx=`${r}<i>${sym}</i>`;
    const mid = COURT[r] ? `<div class="court">${COURT[r]}<b>${sym}</b></div>`
      : `<div class="pips">${PIPS[r].map(([x,y,f,ace])=>`<i class="${f?'f':''} ${ace?'ace':''}" style="left:${x}%;top:${y}%">${sym}</i>`).join('')}</div>`;
    return `<div class="card ${col} su-${s} ${cls}" ${attrs}><span class="idx tl">${idx}</span>${mid}<span class="idx br">${idx}</span></div>`;
  }
  const idx=`${r}${suitSVG(s)}`;
  let mid;
  if(SPR[r]) mid=`<div class="court">${sprite(SPR[r],{o:'#f5c34b','#':'var(--c)'},'crown')}<b>${r}</b></div>`;
  else mid=`<div class="pips">${PIPS[r].map(([x,y,f,ace])=>suitSVG(s,(f?'f ':'')+(ace?'ace':'')).replace('<svg ',`<svg style="left:${x}%;top:${y}%" `)).join('')}</div>`;
  return `<div class="card ${col} su-${s} ${cls}" ${attrs}><span class="idx tl">${idx}</span>${mid}<span class="idx br">${idx}</span></div>`;
}
let toastT;
function toast(m){ let t=$('.toast'); if(!t){t=document.createElement('div');t.className='toast';t.setAttribute('role','status');document.body.appendChild(t);} t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
function splash(){ const d=document.createElement('div'); d.className='splash'; d.innerHTML='<span>BALLS!</span>'; document.body.appendChild(d); setTimeout(()=>d.remove(),1350); }

let db=null, dbChecked=false, ref=null, unsub=null, busy=false, roomCode=null, loadTimer=null, lastSplash=null, botTimer=null, botKey=null;

function applySkin(){ const h=document.documentElement; h.classList.remove('skin-classic','skin-pixel','skin-uno','skin-neon','skin-sketch','ui-felt'); h.classList.add('skin-'+skin); if(skin==='classic'||skin==='uno') h.classList.add('ui-felt'); }
applySkin();

function applyHC(){ document.documentElement.classList.toggle('hc',hc && skin!=='uno'); }

function localRules(){ try{ const r={...DEFAULT_RULES, ...(JSON.parse(load('balls.rules')||'{}')), pub:false};
  if(r.resetB&&r.resetB.from===69&&r.resetB.to===70) r.resetB={...r.resetB,to:0};
  return r; }catch(e){ return {...DEFAULT_RULES}; } }

let lobbyApi=null, openTables=[], listingSig=null, autoTimer=null, autoKey=null;
let homeErr='', botCount=+(load('balls.bots')||3), showScores=false, seenHand=new Set(), firstSnap=true;

const app=$('#app'), layer=$('#layer');

function newId(){ return 'p'+Math.random().toString(36).slice(2,10); }
let onlineId=null;
let localId=load('balls.pid'); if(!localId){ localId=newId(); store('balls.pid',localId); }

async function act(fn){
  if(busy||!S) return;
  const s=structuredClone(S);
  useRules(s);
  const err=fn(s);
  if(err){ toast(err); return; }
  s.v=(s.v||0)+1;
  sel.clear();
  if(mode==='local'){ const pv=S; S=s; afterState(pv); return; }
  const prev=S; busy=true; S=s; afterState(prev);
  try{ await ref.set(s); }catch(e){ S=prev; render(); toast(e&&e.code==='invalid_argument'?'You can only watch this table. Ask the owner to invite you as an editor.':'That move did not reach the table. Check your connection and try again.'); }
  busy=false;
}

function afterState(prev){
  if(S && S.result && (S.phase==='reveal'||S.phase==='over') && lastSplash!==S.result.id){
    splash(); lastSplash=S.result.id;
  }
  const before = (prev && S && prev.phase==='play') ? snapRects() : null;
  render();
  syncListing();
  if(before) animateMove(prev,S,before);
  scheduleBots();
}

/* ---- motion ---- */
const reducedMotion = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
function rectOf(el,isCard){ if(!el) return null; const r=el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2, w:r.width, h:r.height, card:isCard}; }
function snapRects(){
  const m={};
  document.querySelectorAll('[data-card]').forEach(el=>{ m['c:'+el.dataset.card]=rectOf(el,true); });
  document.querySelectorAll('.opp[data-pid]').forEach(el=>{ m['p:'+el.dataset.pid]=rectOf(el,false); });
  const d=document.querySelector('#b-deck .card:last-child'); if(d) m.deck=rectOf(d,true);
  const h=document.querySelector('.hand'); if(h) m.hand=rectOf(h,false);
  return m;
}
function fly(html,from,toEl,{delay=0,dur=480,toRect=null,fade=false}={}){
  const to = toEl ? rectOf(toEl,true) : toRect;
  if(!from||!to) return;
  const ref = document.querySelector('#b-deck .card:last-child');
  const w = to.card ? to.w : (ref ? ref.getBoundingClientRect().width : 70);
  const h = w*1.4;
  const wrap=document.createElement('div'); wrap.className='flyer';
  wrap.style.cssText=`width:${w}px;height:${h}px;--cw:${w}px;left:${to.x-w/2}px;top:${to.y-h/2}px`;
  wrap.innerHTML=html; document.body.appendChild(wrap);
  if(toEl) toEl.style.visibility='hidden';
  const s0 = from.card ? from.w/w : .32, s1 = to.card ? 1 : .32;
  const dx=from.x-to.x, dy=from.y-to.y, spin=(Math.random()*30-15);
  const finish=()=>{ wrap.remove(); if(toEl) toEl.style.visibility=''; };
  if(reducedMotion()||!wrap.animate){ finish(); return; }
  const a=wrap.animate([
    {transform:`translate(${dx}px,${dy}px) scale(${s0}) rotate(${spin}deg)`, opacity: from.card?1:.2},
    {transform:`translate(${dx*.45}px,${dy*.45 - 26}px) scale(${(s0+s1)/2*1.08}) rotate(${spin/2}deg)`, opacity:1, offset:.5},
    {transform:`translate(0,0) scale(${s1}) rotate(0deg)`, opacity: fade?0:1}
  ],{duration:dur,delay,easing:'cubic-bezier(.25,.8,.3,1)',fill:'both'});
  a.onfinish=finish; a.oncancel=finish;
}
function bubble(text,rect,kind){
  if(!rect) return;
  const b=document.createElement('div'); b.className='bubble '+(kind||'');
  b.textContent=text;
  b.style.left=Math.min(Math.max(rect.x,70),innerWidth-70)+'px';
  b.style.top=(rect.y-rect.h/2+4)+'px';
  document.body.appendChild(b); setTimeout(()=>b.remove(),2300);
}
function animateMove(prev,cur,before){
  if(!cur||cur.phase!=='play'||prev.round!==cur.round) return;
  const after=(sel)=>document.querySelector(sel);
  // THROW: cards leave a hand and land in the throw spot
  if(prev.step==='throw' && cur.step==='draw'){
    const who=cur.players[cur.turn].id;
    cur.thrown.forEach((c,i)=>{
      const from = who===me ? before['c:'+c] : before['p:'+who];
      fly(cardHTML(c), from, after(`.mythrow [data-card="${c}"]`), {delay:i*80});
    });
    return;
  }
  // DRAW: a card goes from the deck or the last throw to the player; their throw slides onto the table
  if(prev.step==='draw' && cur.step==='throw' && cur.lastDraw){
    const ld=cur.lastDraw, who=ld.id;
    prev.thrown.forEach((c,i)=>fly(cardHTML(c), before['c:'+c], after(`.availrow [data-card="${c}"]`), {delay:i*60, dur:380}));
    const fromDeck = ld.src==='deck' || !ld.open;
    let card = ld.open;
    if(who===me && fromDeck){ const old=new Set(prev.hands[me]||[]); card=(cur.hands[me]||[]).find(c=>!old.has(c)); }
    const from = fromDeck ? before.deck : before['c:'+card];
    const faceHTML = (who===me || !fromDeck) && card ? cardHTML(card) : cardHTML('back');
    const msg = fromDeck ? 'drew from the deck' : 'took '+label(card)+' from the last throw';
    if(who===me){
      const el=after(`.hand [data-card="${card}"]`);
      fly(faceHTML, from, el, {delay:120, dur:520});
      bubble((fromDeck?'Drew ':'Took ')+(card?label(card):'a card'), rectOf(after('.hand'),false), fromDeck?'bub-deck':'');
    } else {
      const chip=after(`.opp[data-pid="${who}"]`);
      fly(faceHTML, from, null, {delay:120, dur:560, toRect:rectOf(chip,false), fade:true});
      bubble(fromDeck?'Drew from deck':'Took '+label(card), rectOf(chip,false), fromDeck?'bub-deck':'');
    }
  }
}

function iDriveBots(){ return mode==='local' || (S && S.host===me); }
function scheduleBots(){
  if(!S||S.phase!=='play'||!iDriveBots()) return;
  useRules(S);
  const cur=S.players[S.turn]; if(!cur) return;
  if(!cur.bot){ scheduleTimeout(cur); return; }
  const key=S.v+':'+S.turn+':'+S.step;
  if(botKey===key) return;
  botKey=key; clearTimeout(botTimer);
  botTimer=setTimeout(()=>{
    if(!S||S.phase!=='play') return;
    useRules(S);
    const c=S.players[S.turn]; if(!c||!c.bot) return;
    if(S.step==='throw'){
      if(botWantsBalls(S,c.id)) act(s=>doBalls(s,c.id));
      else { const h=S.hands[c.id]; const stuck=(S.turnsTaken[c.id]||0)>25 && Math.random()<.3; const t=stuck?[h[Math.floor(Math.random()*h.length)]]:botThrow(h); act(s=>doThrow(s,c.id,t)); }
    } else {
      const [src,card]=botDraw(S,c.id); act(s=>doDraw(s,c.id,src,card));
    }
  }, (S.step==='throw'?1000:750)*((SPEED[RULES.speed]||SPEED.normal).bot) + Math.max(0,(S.startAt||0)-Date.now()));
}
function scheduleTimeout(cur){
  if(!RULES.turnTimer) return;
  const key=S.round+':'+S.turn+':'+S.turnAt;
  if(autoKey===key) return;
  autoKey=key; clearTimeout(autoTimer);
  const due=(S.turnAt||Date.now())+RULES.turnTimer*1000+400-Date.now();
  autoTimer=setTimeout(()=>{
    if(!S||S.phase!=='play'||S.round+':'+S.turn+':'+S.turnAt!==key) return;
    const id=S.players[S.turn].id, nm=S.players[S.turn].name;
    act(s=>{
      if(s.step==='throw'){ const e=doThrow(s,id,botThrow(s.hands[id])); if(e) return e; }
      const e2=doDraw(s,id,'deck'); if(e2) return e2;
      addLog(s,`${nm} ran out of time`);
    });
  }, Math.max(0,due));
}
function timeLeft(){ if(!S||S.phase!=='play'||!RULES.turnTimer||!roundLive(S)) return null; return Math.max(0,Math.ceil(((S.turnAt||0)+RULES.turnTimer*1000-Date.now())/1000)); }
setInterval(()=>{ const el=document.getElementById('tt'); if(!el) return; const t=timeLeft(); if(t===null){ el.hidden=true; return; } el.hidden=false; el.textContent=t+'s'; el.classList.toggle('low',t<=5); },250);

/* ---- local ---- */
function startLocal(){
  mode='local'; me='me'; seenHand.clear(); lastSplash=null;
  const names=shuffle(BOT_NAMES).slice(0,botCount);
  const players=[{id:'me',name:myName||'You',score:0,out:false}, ...names.map((n,i)=>({id:'b'+i,name:n,score:0,out:false,bot:true}))];
  const rules=localRules(); const cn=cardsNeeded(rules,players.length);
  if(cn.need>cn.have){ mode=null; homeErr=`Not enough cards: ${players.length} players need ${cn.need}, the deck has ${cn.have}. Add a deck or deal fewer cards.`; render(); return; }
  S={v:1,phase:'play',host:'me',players,round:0,dealer:Math.floor(Math.random()*players.length),log:[],rules};
  useRules(S); S.v_round=0; startRound(S); afterState(null);
}

/* ---- online ---- */
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function subscribe(code){
  if(unsub) unsub();
  roomCode=code; mode='online'; ref=db.doc('rooms/'+code); S=null; firstSnap=true; lastSplash=null; seenHand.clear();
  store('balls.room',code);
  render();
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{ if(!S){ toast('The table is not answering yet. Still trying…'); } },10000);
  unsub=ref.onSnapshot(snap=>{
    if(!snap.exists){ if(!snap.metadata.fromCache){ clearTimeout(loadTimer); leaveTable('That table no longer exists.'); } return; }
    if(!snap.metadata.fromCache) clearTimeout(loadTimer);
    const d=snap.data();
    if(busy && S && (d.v||0)<S.v) return;
    if(S && (d.v||0)===S.v && !firstSnap) return;
    const pv=firstSnap?null:S;
    S=structuredClone(d);
    if(firstSnap && S.result) lastSplash=S.result.id;
    afterState(pv); firstSnap=false;
  }, err=>{ clearTimeout(loadTimer); leaveTable('Lost the connection to the table. Rejoin with the code.'); });
}
async function createRoom(){
  me=onlineId;
  if(!myName.trim()){ homeErr='Enter your name first.'; render(); return; }
  let code=genCode();
  const r=db.doc('rooms/'+code);
  const state={v:1,phase:'lobby',host:me,code,players:[{id:me,name:myName.trim(),score:0,out:false}],round:0,dealer:0,log:[],v_round:0,created:Date.now(),rules:localRules()};
  try{ await r.set(state); subscribe(code); }
  catch(e){ homeErr = e&&e.code==='invalid_argument' ? 'You can only view this page, so you cannot open a table. Ask the owner to invite you as an editor.' : 'Could not create the table. Try again.'; render(); }
}
async function joinRoom(code){
  me=onlineId;
  code=(code||'').trim().toUpperCase();
  if(!myName.trim()){ homeErr='Enter your name first.'; render(); return; }
  if(!/^[A-Z]{4}$/.test(code)){ homeErr='A table code is 4 letters.'; render(); return; }
  const r=db.doc('rooms/'+code);
  try{
    let lease={acquired:false};
    for(let i=0;i<6 && !lease.acquired;i++){ lease=await r.acquire({holder:me,ttlMs:4000}); if(!lease.acquired) await new Promise(res=>setTimeout(res,600)); }
    const snap=await r.get();
    if(!snap.exists){ homeErr=`No table with code ${code}.`; render(); return; }
    const d=structuredClone(snap.data());
    const already=d.players.some(p=>p.id===me);
    if(!already){
      if(d.phase!=='lobby'){ homeErr='That game has already started.'; render(); return; }
      const mx=deriveRules(d.rules).maxPlayers; if(d.players.length>=mx){ homeErr=`That table is full (${mx} players).`; render(); return; }
      d.players.push({id:me,name:myName.trim(),score:0,out:false}); d.v=(d.v||0)+1;
      await r.set(d);
    }
    subscribe(code);
  }catch(e){ homeErr = e&&e.code==='invalid_argument' ? 'You can only view this page, so you cannot join. Ask the owner to invite you as an editor.' : 'Could not join the table. Try again.'; render(); }
}
function leaveTable(msg){
  if(S && S.host===me && listingSig && lobbyApi){ try{ lobbyApi.drop(S.code); }catch(e){} listingSig=null; }
  if(cdEl){ cdEl.remove(); cdEl=null; clearInterval(cdTimer); }
  if(unsub){unsub();unsub=null;} clearTimeout(botTimer); botKey=null;
  mode=null; S=null; ref=null; roomCode=null; homeErr=msg||''; store('balls.room',undefined); render();
}

/* ================= RENDER ================= */
function render(){
  layer.innerHTML='';
  useRules(S);
  if(!mode){ renderHome(); if(showRules) renderRulesSheet(); return; }
  if(mode==='online' && !S) { app.innerHTML=`<div class="screen home"><div class="logo">BALLS!</div><p class="tag">Sitting down at table ${esc(roomCode)}…</p><button class="btn ghost" id="b-leave">Back</button></div>`; $('#b-leave').onclick=()=>leaveTable(); return; }
  if(S.phase==='lobby') return renderLobby();
  renderGame();
  syncCountdown();
  if(S.phase==='reveal'||S.phase==='over') renderResult();
  else if(showScores) renderScores();
  else if(showSettings) renderSettings();
}

function renderGame(){
  const myIdx=S.players.findIndex(p=>p.id===me);
  const meP=S.players[myIdx];
  const spectator=!meP;
  const order=[]; for(let k=1;k<S.players.length;k++) order.push(S.players[(Math.max(myIdx,0)+k)%S.players.length]);
  if(spectator) order.unshift(S.players[0]);
  const cur=S.players[S.turn]||{};
  const myTurn=S.phase==='play'&&roundLive(S)&&cur.id===me;
  const hand=meP&&S.hands[me]?sortHand(S.hands[me]):[];
  const hv=handVal(hand);
  const ballsOK=meP&&canCall(S,me);
  const selArr=[...sel].filter(c=>hand.includes(c));
  const throwOK=myTurn&&S.step==='throw'&&selArr.length&&validThrow(selArr);
  const drawStep=myTurn&&S.step==='draw';

  let status, sub='';
  if(S.phase!=='play'){ status='Round over'; }
  else if(!roundLive(S)){ status=`Round ${S.round} is about to start`; sub='Get ready…'; }
  else if(myTurn && S.step==='throw'){
    status='Your turn — throw';
    sub = ballsOK ? `You hold ${hv}. Call Balls, or keep playing.` : (hv<=RULES.callMax ? `You hold ${hv}. You can call Balls next turn.` : 'Tap one card, or several of the same rank.');
  }
  else if(drawStep){ status='Now grab a card'; sub='Tap the deck or a glowing card on the table.'; }
  else { status=`${esc(cur.name)} is ${S.step==='draw'?'grabbing a card':'playing'}…`; sub=''; }

  const newCards=[];
  for(const c of hand){ if(!seenHand.has(c)) newCards.push(c); }
  const roundKey='r'+S.round;
  if(!seenHand.has(roundKey)){ seenHand=new Set([roundKey]); }
  hand.forEach(c=>seenHand.add(c));

  const rot=i=>((i*7)%11-5);
  app.innerHTML=`<div class="screen">
    <div class="top">
      <span class="pill">${mode==='online'?'Table '+esc(roomCode)+' · ':''}Round ${S.round}</span>
      <span class="grow"></span>
      <button class="icon" id="b-scores">Scores</button>
      <button class="icon" id="b-settings">Settings</button>
      <button class="icon" id="b-quit">${mode==='online'?'Leave':'Quit'}</button>
    </div>
    <div class="opps">${order.map(p=>{
      const n=(S.hands[p.id]||[]).length;
      return `<div class="opp ${p.id===cur.id&&S.phase==='play'?'turn':''} ${p.out?'out':''}" data-pid="${esc(p.id)}">
        <span class="av" style="background:${avColor(p.id)}">${esc((p.name||'?')[0].toUpperCase())}</span>
        <span class="nm">${esc(p.name)}</span>
        <div class="minifan" aria-label="${n} cards">${p.out?'':'<i></i>'.repeat(Math.min(n,5))+(n>5?`<em class="mfn">+${n-5}</em>`:'')}</div>
        <span class="sc">${p.out?'out':p.score+' pts'}</span>${rankBadge(S,p.id)}
      </div>`;}).join('')}</div>
    <div class="feed" aria-live="polite">${(()=>{ const l=(S.log||[]).slice(-1)[0]||''; const i=l.indexOf(' '); return i>0?'<b>'+esc(l.slice(0,i))+'</b>'+esc(l.slice(i)):esc(l); })()}</div>
    <div class="table">
      <div class="stackwrap">
        <button class="deck ${drawStep?'':'locked'}" id="b-deck" aria-label="Draw from the deck" ${drawStep?'':'disabled'} style="border-radius:calc(var(--cw)*.09)">
          ${S.deck.length>2?cardHTML('back'):''}${S.deck.length>1?cardHTML('back'):''}${cardHTML('back',{cls:drawStep?'pick':''})}
        </button>
        <span class="cap">Deck · ${S.deck.length}</span>
      </div>
      <div class="stackwrap">
        <div class="availrow">${S.avail.map((c,i)=>cardHTML(c,{cls:(drawStep?'pick':''),attrs:`data-take="${c}" data-card="${c}" style="--rot:${rot(i)}deg" ${drawStep?'tabindex="0" role="button" aria-label="Take '+label(c)+'"':''}`})).join('')}</div>
        <span class="cap">${S.round&&S.turnsTaken&&Object.values(S.turnsTaken).every(n=>!n)?'Face-up card':'Last throw'}</span>
      </div>
      ${S.thrown&&S.thrown.length?`<div class="mythrow"><div class="cards">${S.thrown.map(c=>cardHTML(c,{attrs:`data-card="${c}"`})).join('')}</div><span class="cap" style="font-size:10px;color:var(--ink-dim)">${myTurn?'Your throw':esc(cur.name)+'’s throw'}</span></div>`:''}
    </div>
    <div class="status" aria-live="polite">${status} <span class="ttimer" id="tt" hidden></span><small>${sub}</small></div>
    <div class="hand ${myTurn&&S.step==='throw'?'':'locked'}" role="group" aria-label="Your hand" style="--ov:${hand.length<=4?-.1:hand.length===5?-.2:hand.length===6?-.34:-.45}">${spectator?'<p class="note">You are watching this game.</p>':hand.map((c,i)=>cardHTML(c,{cls:(sel.has(c)?'sel ':'')+(newCards.includes(c)&&seenHand.size>1?'new':''),attrs:`style="--i:${i}" data-c="${c}" data-card="${c}" tabindex="0" role="button" aria-pressed="${sel.has(c)}" aria-label="${label(c)}"`})).join('')}</div>
    <div class="dock">
      <div class="total ${hv<=RULES.callMax?'low':''}"><b>${hv}</b><span>hand</span></div>
      <div class="total"><b>${meP?meP.score:'–'}</b><span>score</span>${meP?rankBadge(S,me):''}</div>
      <span class="grow"></span>
      <button class="btn" id="b-throw" ${throwOK?'':'disabled'}>Throw${selArr.length>1?' '+selArr.length:''}</button>
      <button class="balls ${ballsOK?'ready':''}" id="b-balls" ${ballsOK?'':'disabled'}>BALLS!</button>
    </div>
  </div>`;

  $('#b-scores').onclick=()=>{ showScores=true; render(); };
  $('#b-settings').onclick=()=>{ showSettings=true; render(); };
  $('#b-quit').onclick=()=>{ if(cdEl){ cdEl.remove(); cdEl=null; clearInterval(cdTimer); } if(mode==='online') leaveTable(); else { mode=null; S=null; clearTimeout(botTimer); botKey=null; render(); } };
  app.querySelectorAll('.hand [data-c]').forEach(el=>{
    const toggle=()=>{ if(!(myTurn&&S.step==='throw')) return; const c=el.dataset.c; sel.has(c)?sel.delete(c):sel.add(c); render(); };
    el.onclick=toggle; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();} };
  });
  $('#b-throw').onclick=()=>{ const cs=[...sel]; act(s=>doThrow(s,me,cs)); };
  $('#b-balls').onclick=()=>act(s=>doBalls(s,me));
  $('#b-deck').onclick=()=>{ if(drawStep) act(s=>doDraw(s,me,'deck')); };
  if(drawStep) app.querySelectorAll('[data-take]').forEach(el=>{
    const take=()=>act(s=>doDraw(s,me,'avail',el.dataset.take));
    el.onclick=take; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();take();} };
  });
}

const RULE_FIELDS=[

function rulesFormHTML(r,{editable=true,online=false}={}){
  const dis=editable?'':'disabled';
  const sel=([k,lab,opts,only,fmt])=>{ if(only==='online'&&!online) return '';
    const list=opts.includes(r[k])?opts:[...opts,r[k]];
    return `<label for="ru-${k}">${lab}</label><select id="ru-${k}" data-rule="${k}" ${dis}>${list.map(v=>`<option value="${v}" ${v===r[k]?'selected':''}>${fmt?fmt(v):v}</option>`).join('')}</select>`; };
  const reset=(key,lab)=>`<label class="rreset"><input type="checkbox" id="ru-${key}-on" ${r[key].on?'checked':''} ${dis}> ${lab}</label>
    <span class="rreset-n">exactly <input type="number" inputmode="numeric" id="ru-${key}-from" value="${r[key].from}" ${dis}> → <input type="number" inputmode="numeric" id="ru-${key}-to" value="${r[key].to}" ${dis}></span>`;
  return `<div class="rgrid rules-form">
    ${online?`<label for="ru-pub">Public table</label><label class="switch"><input type="checkbox" id="ru-pub" ${r.pub?'checked':''} ${dis}> <span>${r.pub?'Listed in Open tables':'Code only'}</span></label>`:''}
    ${RULE_FIELDS.map(sel).join('')}
    ${reset('resetA','Score reset 1')}
    ${reset('resetB','Score reset 2')}
  </div>`;
}
function readRulesForm(root,base){
  const r={...base};
  root.querySelectorAll('.rules-form [data-rule]').forEach(el=>{ const k=el.dataset.rule; r[k]= k==='speed'? el.value : +el.value; });
  for(const k of ['resetA','resetB']){ const on=root.querySelector(`#ru-${k}-on`), f=root.querySelector(`#ru-${k}-from`), t=root.querySelector(`#ru-${k}-to`);
    if(on) r[k]={on:on.checked, from:Math.round(+f.value||0), to:Math.round(+t.value||0)}; }
  const pub=root.querySelector('#ru-pub'); if(pub) r.pub=pub.checked;
  delete r.resets; return r;
}
function wireRulesForm(root,base,onChange){
  root.querySelectorAll('.rules-form select, .rules-form input').forEach(el=>el.onchange=()=>onChange(readRulesForm(root,base)));
}
function rulesSummary(r){
  const R=deriveRules(r), d=deriveRules(null), diff=[];
  if(R.startHand!==d.startHand) diff.push(R.startHand+' cards');
  if(R.decks!==d.decks) diff.push(R.decks+' decks');
  if(R.jokers!==d.jokers) diff.push(R.jokers+' jokers/deck');
  if(R.callMax!==d.callMax) diff.push('Balls at '+R.callMax);
  if(R.falsePenalty!==d.falsePenalty) diff.push('false +'+R.falsePenalty);
  if(R.elimAt!==d.elimAt) diff.push('out at '+R.elimAt);
  if(R.jokerVal!==d.jokerVal) diff.push('joker '+R.jokerVal);
  if(R.jackVal!==d.jackVal) diff.push('jack '+R.jackVal);
  if(JSON.stringify(R.resets)!==JSON.stringify(d.resets)) diff.push('custom resets');
  if(R.speed!=='normal') diff.push(R.speed);
  if(R.turnTimer) diff.push(R.turnTimer+'s turns');
  return diff.length?'Custom rules: '+diff.join(', '):'Standard rules';
}

function claudeLobby(db){
  return {
    watch(cb){ return db.collection('lobby').onSnapshot(q=>cb(q.docs.map(d=>({code:d.id,...d.data()}))),()=>{}); },
    put(code,info){ return db.doc('lobby/'+code).set(info); },
    drop(code){ return db.doc('lobby/'+code).delete(); }
  };
}

let cdEl=null, cdTimer=null, cdRound=null;
function syncCountdown(){
  const live = !S || S.phase!=='play' || roundLive(S);
  const key = S ? S.round+':'+S.startAt : null;
  if(live){ if(cdEl && Date.now() > (S&&S.startAt||0)+700){ cdEl.remove(); cdEl=null; clearInterval(cdTimer); } return; }
  if(cdEl && cdRound===key) return;
  if(cdEl){ cdEl.remove(); clearInterval(cdTimer); }
  cdRound=key;
  cdEl=document.createElement('div'); cdEl.className='countdown'; cdEl.setAttribute('role','status');
  const dealer=S.players[S.dealer]?S.players[S.dealer].name:'';
  const first=S.players[S.turn]?S.players[S.turn].name:'';
  cdEl.innerHTML=`<div class="cd-box"><div class="cd-round">Round ${S.round}</div><div class="cd-num" aria-live="assertive"></div><div class="cd-sub">${esc(dealer)} deals · ${S.players[S.turn]&&S.players[S.turn].id===me?'you start':esc(first)+' starts'}</div></div>`;
  document.body.appendChild(cdEl);
  let last='';
  const tick=()=>{
    const left=(S.startAt||0)-Date.now();
    const txt = left>0 ? String(Math.ceil(left/1000)) : 'Go!';
    if(txt!==last){ const n=cdEl.querySelector('.cd-num'); n.textContent=txt; n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); last=txt; }
    if(left<=0){ clearInterval(cdTimer); render(); setTimeout(()=>{ if(cdEl&&cdRound===key){ cdEl.classList.add('out'); setTimeout(()=>{ if(cdEl&&cdRound===key){ cdEl.remove(); cdEl=null; } },300); } },650); }
  };
  tick(); cdTimer=setInterval(tick,100);
}

    <button class="btn" id="b-close">Back to the table</button></div></div>`;
  $('#b-close').onclick=()=>{ showScores=false; render(); };
  $('#ov').onclick=e=>{ if(e.target.id==='ov'){ showScores=false; render(); } };
}

function renderResult(){
  const r=S.result; if(!r) return;
  const caller=pname(S,r.caller), win=pname(S,r.winner);
  const over=S.phase==='over';
  const champ=aliveList(S)[0];
  const canNext = mode==='local' || S.host===me;
  const head = over
    ? `<h3><span class="hl">${esc(champ?champ.name:'Nobody')}</span> wins the game!</h3>`
    : r.falseB && r.winner===null
      ? `<h3><span class="hl">False Balls!</span> ${esc(caller)} called with ${r.cv}</h3><p class="sub">${r.beaters.length} players tied or beat it, so nobody wins the round. ${esc(caller)} takes +${RULES.falsePenalty}. Coin flip: ${esc(S.players[S.dealer].name)} deals next.</p>`
    : r.falseB
      ? `<h3><span class="hl">False Balls!</span> ${esc(caller)} called with ${r.cv}</h3><p class="sub">${esc(win)} tied or beat it and wins the round. ${esc(caller)} takes +${RULES.falsePenalty}.</p>`
      : `<h3>${esc(caller)} called <span class="hl">Balls</span> with ${r.cv}</h3><p class="sub">Lowest hand. ${esc(caller)} deals next round.</p>`;
  layer.innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-label="Round result">
    ${head}
    ${over?`<p class="sub">Final round: ${esc(caller)} called ${r.falseB?'false ':''}Balls with ${r.cv}.</p>`:''}
    <div class="res">${r.rows.map(x=>`<div class="rrow ${x.id===r.winner?'win':''}">
      <span class="who">${rankBadge(S,x.id)} ${esc(pname(S,x.id))}${x.id===r.winner?'<span class="tagn">round win</span>':''}${x.notes.map(n=>`<span class="tagn ${n==='Eliminated'?'bad':''}">${esc(n)}</span>`).join('')}</span>
      <span class="gain">${x.gain>=0?'+':''}${x.gain}</span>
      <span class="tot">${x.after}</span>
      <div class="cardsline">${x.hand.map((c,i)=>cardHTML(c,{cls:'small'})).join('')}<span class="hv">${x.v} in hand</span></div>
    </div>`).join('')}</div>
    ${canNext
      ? `<button class="btn" id="b-next">${over?(mode==='local'?'New game':'Back to lobby'):'Deal next round'}</button>`
      : `<p class="note">Waiting for ${esc(pname(S,S.host))} to ${over?'reset the table':'deal'}…</p>`}
    ${over?`<button class="btn ghost" id="b-home">${mode==='online'?'Leave table':'Main menu'}</button>`:''}
  </div></div>`;
  const nx=$('#b-next');
  if(nx) nx.onclick=()=>{
    if(over && mode==='local'){ startLocal(); return; }
    if(over){ act(s=>{ s.phase='lobby'; s.round=0; s.result=null; s.players.forEach(p=>{p.score=0;p.out=false;}); s.hands={}; s.log=[]; }); return; }
    act(s=>{ s.v_round=(s.v_round||0)+1; startRound(s); });
  };
  const hm=$('#b-home'); if(hm) hm.onclick=()=>{ if(mode==='online') leaveTable(); else { mode=null; S=null; render(); } };
}

const FB_VER='10.12.2';
function loadScript(srcs){
  return new Promise((res,rej)=>{
    const tryAt=i=>{ if(i>=srcs.length) return rej(new Error('load failed'));
      const el=document.createElement('script'); el.src=srcs[i]; el.async=true;
      el.onload=()=>res(); el.onerror=()=>{ el.remove(); tryAt(i+1); }; document.head.appendChild(el); };
    tryAt(0);
  });
}
async function firebaseDB(){
  try{
    const lib=n=>[`https://www.gstatic.com/firebasejs/${FB_VER}/${n}`,`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/${n}`];
    await loadScript(lib('firebase-app-compat.js'));
    await loadScript(lib('firebase-database-compat.js'));
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    const rtdb = app.database();
    const wrapSnap = snap => { const v=snap.val(); let d=null; try{ d=v&&v.json?JSON.parse(v.json):null; }catch(e){}
      return { exists: !!d, data: ()=>d, metadata:{fromCache:false, hasPendingWrites:false} }; };
    return {
      lobby:{
        watch(cb){ const r=rtdb.ref('lobby'); const f=snap=>{ const v=snap.val()||{}; cb(Object.entries(v).map(([code,x])=>({code,...x}))); }; r.on('value',f,()=>{}); return ()=>r.off('value',f); },
        put(code,info){ return rtdb.ref('lobby/'+code).set(info); },
        drop(code){ return rtdb.ref('lobby/'+code).remove(); }
      },
      doc(path){
        const r=rtdb.ref(path);
        return {
          path,
          set: data => r.set({json:JSON.stringify(data), v:data.v||0, at:Date.now()}),
          get: async () => wrapSnap(await r.get()),
          onSnapshot(next,err){
            const cb=snap=>next(wrapSnap(snap));
            r.on('value',cb,e=>err&&err({code:'unavailable',message:String(e&&e.message||e)}));
            return ()=>r.off('value',cb);
          },
          async acquire({holder,ttlMs=4000}){
            const lock=rtdb.ref(path+'_lock'); const now=Date.now();
            const t=await lock.transaction(cur=>(!cur||cur.exp<now||cur.holder===holder)?{holder,exp:now+ttlMs}:undefined);
            return {acquired:!!t.committed};
          }
        };
      }
    };
  }catch(e){ return null; }
}
