/* Layout: one-screen game table — opponents across the top, deck + throw pile in the centre, your hand docked at the bottom.
   Single committed look: pixel-arcade table (swirling dark felt, chunky flat panels, hard pixel shadows, sprite suits). */
:root{
  --bg:#1f4a45; --bg-deep:#102624; --swirl-a:#2c6a5e; --swirl-b:#6e2b35;
  --panel:#2c3a3f; --panel-hi:#3d5058; --panel-lo:#172025; --line:#55707a;
  --ink:#ffffff; --ink-dim:#b7c9cc;
  --red:#fe5f55; --red-lo:#a8322b; --blue:#009dff; --blue-lo:#00609c; --orange:#fda200; --orange-lo:#a86b00; --green:#4bc292; --gold:#f5c34b;
  --card:#f3efe4; --card-edge:#c9c0ad; --card-red:#e5484d; --card-dark:#33395c;
  --px:"BalatroPx","Pixelify Sans","Courier New",ui-monospace,monospace;
  --ch:calc(var(--cw)*1.4);
  color-scheme:dark;
}
html,body,#app{height:100%}
[hidden]{display:none!important}
body{background:var(--bg-deep);color:var(--ink);font-family:var(--px);font-weight:400;font-size:16px;overflow:hidden;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:none}
.fx{position:fixed;inset:-30%;z-index:-2;background:
  repeating-conic-gradient(from 0deg at 50% 50%,var(--swirl-a) 0deg 14deg,var(--bg) 14deg 30deg,var(--swirl-b) 30deg 36deg,var(--bg) 36deg 60deg);
  filter:blur(28px) saturate(1.1);opacity:.55;animation:swirl 60s linear infinite}
.fx2{position:fixed;inset:0;z-index:-1;pointer-events:none;background:
  radial-gradient(ellipse at 50% 50%,transparent 40%,rgba(0,0,0,.55) 100%),
  repeating-linear-gradient(0deg,rgba(0,0,0,.12) 0 1px,transparent 1px 3px)}
@keyframes swirl{to{transform:rotate(360deg)}}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,.card:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.screen{height:100%;display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;box-sizing:border-box;gap:10px;max-width:900px;margin:0 auto}
svg.spr{shape-rendering:crispEdges;display:block}

/* ---------- home ---------- */
.home{justify-content:flex-start;align-items:center;overflow-y:auto}
.home>:first-child{margin-top:auto}.home>:last-child{margin-bottom:auto}
.home.lobby>:first-child{margin-top:0}.home.lobby>:last-child{margin-bottom:0}
.home.lobby{padding-bottom:24px}
.logo{font-family:var(--px);font-weight:700;font-size:clamp(60px,18vw,112px);line-height:.9;color:var(--ink);text-shadow:4px 4px 0 var(--red),8px 8px 0 var(--panel-lo);letter-spacing:.02em;margin:18px 0 6px;animation:bob 3s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-6px) rotate(-1deg)}}
.logo.nl{font-size:clamp(40px,12.5vw,92px)}
.top .pill,.top .icon{white-space:nowrap}
.tag{color:var(--ink-dim);text-align:center;max-width:32ch;margin:0;font-size:15px;line-height:1.35}
.panel{background:var(--panel);border:3px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:12px;width:100%;max-width:380px;box-sizing:border-box;box-shadow:0 5px 0 var(--panel-lo)}
.panel h2{font-weight:700;font-size:20px;margin:0;letter-spacing:.04em;text-transform:uppercase}
label.lbl{font-size:13px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim)}
input.txt{width:100%;box-sizing:border-box;background:var(--panel-lo);border:3px solid var(--line);border-radius:8px;padding:10px 12px;font:inherit;font-weight:600;color:var(--ink);font-size:17px}
input.txt::placeholder{color:rgba(255,255,255,.35)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{font-weight:700;font-size:19px;letter-spacing:.05em;text-transform:uppercase;padding:10px 18px;border-radius:8px;background:var(--orange);color:#fff;box-shadow:0 5px 0 var(--orange-lo);text-shadow:2px 2px 0 rgba(0,0,0,.25);transition:transform .06s,box-shadow .06s,opacity .15s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--orange-lo)}
.btn.alt{background:var(--blue);box-shadow:0 5px 0 var(--blue-lo)}
.btn.alt:active{box-shadow:0 1px 0 var(--blue-lo)}
.btn.ghost{background:var(--panel-hi);box-shadow:0 5px 0 var(--panel-lo)}
.btn.ghost:active{box-shadow:0 1px 0 var(--panel-lo)}
.btn[disabled]{opacity:.35;pointer-events:none}
.grow{flex:1}
.seg{display:flex;gap:6px}
.seg.wrap{flex-wrap:wrap;justify-content:flex-end;max-width:260px}
.seg.wrap button{height:36px}
.rgrid{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 12px;align-items:center;font-size:15px}
.rgrid select,.rgrid input[type=number]{font:inherit;font-size:15px;color:var(--ink);background:var(--panel-lo);border:2px solid var(--line);border-radius:6px;padding:5px 8px}
.rgrid input[type=number]{width:3.6em;padding:4px 6px}
.rgrid select:disabled,.rgrid input:disabled{opacity:.7}
.rgrid .rsec{grid-column:1/-1;margin:10px 0 0;font-size:17px}
.rgrid .rnote{grid-column:1/-1;margin:-4px 0 0}
.modebtn{display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;padding:12px 14px}
.modebtn b{font-size:19px}.modebtn span{font-size:14px;font-weight:400;line-height:1.3;opacity:.9}
.devsheet{max-width:560px}.devtabs .btn{flex:1;font-size:16px}
.devbars{display:flex;flex-direction:column;gap:10px}
.devbar-top{display:flex;justify-content:space-between;gap:8px;font-size:15px}.devbar small{color:var(--ink-dim);font-size:13px}
.devbar-track{height:10px;border-radius:999px;background:var(--panel-lo);overflow:hidden;margin:4px 0 2px}.devbar-track i{display:block;height:100%;background:var(--green,#3fae5a)}
.devbar.warm .devbar-track i{background:#e0a526}.devbar.hot .devbar-track i{background:var(--red)}
.devnums{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}.devnums label{display:flex;flex-direction:column;font-size:13px;gap:2px}.devnums .txt{padding:6px 8px}
.devchecks{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:4px 10px;font-size:14px}.devchecks label{display:flex;gap:6px;align-items:center}
.devmini{padding:2px 10px;font-size:13px;margin-left:6px}
.devusers li{display:flex;align-items:center;justify-content:space-between;gap:8px}.devusers .btn{padding:4px 10px;font-size:15px}
.mlog{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.mlog li{background:var(--panel-lo);border-radius:8px;padding:7px 10px;display:flex;flex-direction:column;gap:2px}
.mlog li.win{box-shadow:inset 3px 0 0 var(--gold)}
.mlog-top{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.mlog-top .note{margin-left:auto;font-size:13px}
.mlog small{font-size:13px;color:var(--ink-dim);line-height:1.3}
.mlog-tag{font-size:12px;padding:1px 7px;border-radius:999px;background:rgba(127,127,127,.25)}.mlog-tag.std{background:var(--gold);color:#2a1d00}
.ui-felt .mlog li{background:rgba(0,0,0,.3)}
.devach{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px}
.devach li{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;background:var(--panel-lo);border-radius:8px;padding:6px 9px;opacity:.6}
.devach li.got{opacity:1}.devach li>span:first-child{display:flex;flex-direction:column;min-width:0}.devach small{font-size:12px;color:var(--ink-dim)}
.devach-st{font-size:12px;text-align:right;color:var(--ink-dim);white-space:nowrap}.devach li.got .devach-st{color:var(--gold)}
.devraw{max-height:240px;overflow:auto;font-size:11px;white-space:pre-wrap;word-break:break-all;background:rgba(0,0,0,.3);padding:8px;border-radius:6px}
.tablekind{margin:0;font-weight:700;color:var(--ink-dim)}.tablekind.std{color:var(--gold)}
.rgrid input[type=checkbox]{accent-color:var(--gold);width:18px;height:18px;vertical-align:-3px}
.rgrid .switch{display:flex;align-items:center;gap:6px;justify-self:end;font-size:13px;color:var(--ink-dim)}
.rreset-n{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--ink-dim);justify-self:end}
.ttimer{display:inline-block;font-size:.7em;padding:2px 7px;border-radius:6px;background:var(--panel-lo);color:var(--ink);vertical-align:3px}
.ttimer.low{background:var(--red);color:#fff}
.seg button{width:40px;height:40px;border-radius:8px;background:var(--panel-lo);border:3px solid var(--line);font-weight:700;font-size:18px}
.seg button[aria-pressed="true"]{background:var(--red);border-color:var(--red);box-shadow:0 3px 0 var(--red-lo)}
.note{font-size:14px;color:var(--ink-dim);margin:0;line-height:1.35}
.err{color:var(--red);font-size:14px;margin:0}
.acctrow{display:flex;align-items:center;justify-content:space-between;gap:10px}
.acctrow>div{display:flex;flex-direction:column;gap:2px;min-width:0}
.acctrow b{font-size:20px;overflow:hidden;text-overflow:ellipsis}
.acctrow .btn{padding:8px 14px;font-size:16px}
.acctsheet .stiles{margin:4px 0;grid-template-columns:repeat(2,minmax(0,1fr))}
.note.ranked.on{color:var(--ink)}
.devname{color:var(--gold);text-shadow:0 0 8px rgba(245,195,75,.45),0 1px 0 rgba(0,0,0,.5);font-weight:700}
.devtag{display:inline-block;margin-left:5px;padding:1px 5px 0;border-radius:4px;background:linear-gradient(180deg,#ffe08a,#e0a526);color:#3a2600;font-size:10px;font-weight:800;letter-spacing:.08em;line-height:1.4;vertical-align:middle;text-shadow:none;box-shadow:0 1px 0 rgba(0,0,0,.35)}
.skin-sketch .devname{color:#a87300;text-shadow:none}
.vf{display:inline-block;margin-left:5px;font-size:12px;font-weight:700;color:var(--green)}
.achh{margin:8px 0 2px;font-size:18px}.achh small{font-size:14px;color:var(--ink-dim);font-weight:600}
.pokerlist{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.pokerlist li{padding:4px 9px;border-radius:999px;background:var(--panel-lo);font-size:13px;font-weight:600;opacity:.45}
.pokerlist li.got{opacity:1;background:var(--gold);color:#2a1d00}
.ui-felt .pokerlist li{background:rgba(0,0,0,.3)}.ui-felt .pokerlist li.got{background:var(--gold)}
.achlist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.achlist li{display:flex;align-items:center;gap:10px;background:var(--panel-lo);border-radius:8px;padding:7px 10px;opacity:.5}
.achlist li.got{opacity:1}
.achlist li>span:nth-child(2){display:flex;flex-direction:column;min-width:0}
.achlist b{font-size:15px}.achlist small{font-size:13px;color:var(--ink-dim);line-height:1.25}
.achic{font-size:20px;line-height:1;color:var(--ink-dim)}.achlist li.got .achic{color:var(--gold)}
.ui-felt .achlist li{background:rgba(0,0,0,.3)}
details.rules{width:100%;max-width:380px}
details.rules summary{cursor:pointer;font-weight:700;font-size:18px;padding:8px 0;color:var(--gold);text-transform:uppercase;letter-spacing:.05em}
details.rules ul{margin:4px 0 0;padding-left:18px;color:var(--ink-dim);line-height:1.45;font-size:15px}
.howto{display:flex;flex-direction:column;gap:2px;padding-bottom:6px}
.howto h4{margin:10px 0 2px;font-size:15px;font-weight:700;color:var(--ink);text-transform:uppercase;letter-spacing:.06em}
.howto p{margin:2px 0;color:var(--ink-dim);line-height:1.45;font-size:15px}
.howto ul{margin:0}
.howto .credit{margin-top:12px;font-size:12px}
.dl-entry h4{display:flex;align-items:baseline;gap:8px;text-transform:none;letter-spacing:.02em}
.dl-entry h4 small{font-size:12px;font-weight:500;color:var(--ink-dim)}
.dl-new{font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;background:var(--gold);color:#1e1600;text-transform:uppercase;letter-spacing:.05em}
.version{margin:4px 0 0;font-size:12px;color:var(--ink-dim);text-align:center;width:100%}
@media (min-width:760px){ .home details.devlog,.home .version{grid-column:1/-1;justify-self:center;max-width:776px} }
details.rules b{color:var(--ink)}

/* ---------- lobby ---------- */
.code{font-weight:700;font-size:50px;letter-spacing:.16em;color:var(--gold);text-align:center;line-height:1;text-shadow:3px 3px 0 var(--panel-lo)}
.plist{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.plist li{display:flex;align-items:center;gap:10px;background:var(--panel-lo);border-radius:8px;padding:8px 10px}
.av{width:28px;height:28px;border-radius:6px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff;flex:none;box-shadow:0 3px 0 rgba(0,0,0,.35)}
.plist .x{margin-left:auto;font-size:13px;color:var(--ink-dim);padding:4px 8px}

/* ---------- game ---------- */
.top{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-dim)}
.top .pill,.top .icon{background:var(--panel);border:2px solid var(--line);border-radius:8px;padding:4px 10px;font-weight:600;font-variant-numeric:tabular-nums;box-shadow:0 3px 0 var(--panel-lo)}
.top .icon{color:var(--ink)}
.opps{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.opp{background:var(--panel);border:3px solid var(--line);border-radius:10px;padding:6px 4px 7px;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;box-shadow:0 4px 0 var(--panel-lo);transition:transform .2s}
.opp.turn{border-color:var(--gold);transform:translateY(-3px);box-shadow:0 7px 0 var(--panel-lo)}
.opp.out{opacity:.35}
.opp .nm{font-weight:700;font-size:13px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.opp .sc{font-size:12px;color:var(--ink-dim);font-variant-numeric:tabular-nums}
.opp.turn .sc{color:var(--gold)}
.minifan{display:flex;height:24px}
.minifan i{width:15px;height:22px;border-radius:3px;background-color:#b8383d;background-image:linear-gradient(45deg,#9a2a30 25%,transparent 25%,transparent 75%,#9a2a30 75%),linear-gradient(45deg,#9a2a30 25%,transparent 25%,transparent 75%,#9a2a30 75%);background-size:6px 6px;background-position:0 0,3px 3px;border:2px solid var(--card);margin-left:-8px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.minifan i:first-child{margin-left:0}
.minifan{align-items:center;max-width:100%}
.mfn{font-style:normal;font-size:11px;font-weight:700;margin-left:3px;color:var(--ink-dim)}

.table{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;gap:clamp(18px,7vw,60px);position:relative}
.stackwrap{display:flex;flex-direction:column;align-items:center;gap:8px}
.stackwrap .cap{font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim);font-variant-numeric:tabular-nums;background:var(--panel-lo);padding:2px 8px;border-radius:6px}
.deck{position:relative;width:var(--cw);height:var(--ch)}
html .deck .card{position:absolute;left:0;top:0}
.deck .card:nth-child(2){transform:translate(-3px,-3px)}
.deck .card:nth-child(3){transform:translate(-6px,-6px)}
.availrow{display:flex;min-height:var(--ch);align-items:center}
.availrow .card{margin-left:calc(var(--cw)*-.55);transform:rotate(var(--rot,0deg))}
.availrow .card:first-child{margin-left:0}
.pick{animation:glow .9s steps(2,end) infinite;cursor:pointer}
@keyframes glow{0%,100%{box-shadow:0 0 0 3px var(--gold),0 5px 0 rgba(0,0,0,.4)}50%{box-shadow:0 0 0 5px var(--gold),0 5px 0 rgba(0,0,0,.4)}}
.mythrow{position:absolute;right:0;bottom:4px;display:flex;flex-direction:column;align-items:center;gap:4px}
.mythrow .cards{display:flex}
.mythrow .card{--cw:clamp(38px,10vw,56px);margin-left:-22px}
.mythrow .card:first-child{margin-left:0}

.status{text-align:center;font-weight:700;font-size:clamp(18px,4.8vw,23px);letter-spacing:.03em;min-height:1.3em;text-shadow:2px 2px 0 var(--panel-lo)}
.status small{display:block;font-weight:500;font-size:13px;color:var(--ink-dim);letter-spacing:0;margin-top:2px;min-height:1.3em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hand{display:flex;justify-content:center;align-items:flex-end;min-height:calc(var(--ch) + 24px);padding-top:22px}
.hand .card{margin-left:calc(var(--cw)*var(--ov,-.16));transition:transform .15s ease;cursor:pointer;animation:sway 3.2s ease-in-out infinite;animation-delay:calc(var(--t0,0s) + var(--i,0)*-.45s)}
@keyframes sway{0%,100%{translate:0 0}50%{translate:0 -4px}}
.hand .card:first-child{margin-left:0}
.hand .card.sel{transform:translateY(-22px)}
:root{--turn:#f5c34b}
.ui-felt{--turn:#ffcf2e}
.skin-classic{--turn:#f0c56a}
.skin-neon{--turn:#00e5ff}
.skin-sketch{--turn:#f2b33d}
.hand .card::before,.availrow .card::before,#b-deck .card:last-child::before{content:"";position:absolute;inset:0;border-radius:inherit;background:#fff;opacity:0;transition:opacity .12s;pointer-events:none;z-index:5}
@media (hover:hover){
  .hand:not(.locked) .card:hover{transform:translateY(-12px);box-shadow:0 0 0 2px var(--turn),0 10px 22px rgba(0,0,0,.35),0 0 18px color-mix(in srgb,var(--turn) 55%,transparent)}
  .hand:not(.locked) .card:hover::before{opacity:.14}
  .hand:not(.locked) .card.sel:hover{transform:translateY(-26px)}
  .hand.locked .card:hover{transform:translateY(-6px)}
  .hand.locked .card:hover::before{opacity:.08}
  .availrow .card.pick:hover,#b-deck:not([disabled]):hover .card:last-child{transform:translateY(-8px) rotate(var(--rot,0deg))}
  .availrow .card.pick:hover::before,#b-deck:not([disabled]):hover .card:last-child::before{opacity:.14}
}
.hand .card.sel::after{content:"";position:absolute;inset:-4px;border:3px solid var(--gold);border-radius:calc(var(--cw)*.1 + 3px);pointer-events:none}
.hand.locked .card{cursor:default}
.dock{display:flex;align-items:center;gap:6px}
.dock .btn{font-size:17px;padding:9px 12px}
.total{background:var(--panel);border:3px solid var(--line);border-radius:10px;padding:3px 6px;text-align:center;min-width:46px;box-shadow:0 4px 0 var(--panel-lo)}
.total b{display:block;font-weight:700;font-size:21px;line-height:1.05;font-variant-numeric:tabular-nums}
.total span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-dim)}
.total.low{border-color:var(--blue)} .total.low b{color:var(--blue)}
.balls{font-weight:700;font-size:18px;padding:9px 12px;border-radius:8px;background:var(--red);color:#fff;box-shadow:0 5px 0 var(--red-lo);letter-spacing:.06em;text-shadow:2px 2px 0 rgba(0,0,0,.25)}
.balls:active{transform:translateY(4px);box-shadow:0 1px 0 var(--red-lo)}
.balls.ready{animation:shake 1.2s steps(6,end) infinite}
@keyframes shake{0%,100%{transform:rotate(0)}20%{transform:rotate(-4deg)}40%{transform:rotate(4deg)}60%{transform:rotate(-3deg)}80%{transform:rotate(2deg)}}
.balls[disabled]{opacity:.32;animation:none}

/* ---------- cards: traditional deck drawn as pixel sprites ---------- */
.skin-pixel .card{--c:var(--card-dark);width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.1);background:var(--card);border:2px solid var(--card-edge);box-sizing:border-box;position:relative;flex:none;box-shadow:0 5px 0 rgba(0,0,0,.4);user-select:none;color:var(--c);font-family:var(--px);font-weight:700}
.skin-pixel .card.red{--c:var(--card-red)}
.skin-pixel .card .idx{position:absolute;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:.9;font-size:calc(var(--cw)*.22);z-index:2}
.skin-pixel .card .idx svg{width:calc(var(--cw)*.14);height:auto}
.skin-pixel .card .tl{left:6%;top:4%}.card .br{right:6%;bottom:4%;transform:rotate(180deg)}
.skin-pixel .card .pips{position:absolute;inset:12% 22%}
.skin-pixel .card .pips svg{position:absolute;width:calc(var(--cw)*.17);height:auto;transform:translate(-50%,-50%)}
.skin-pixel .card .pips svg.f{transform:translate(-50%,-50%) rotate(180deg)}
.skin-pixel .card .pips svg.ace{width:calc(var(--cw)*.42)}
.skin-pixel .card .court{position:absolute;inset:13% 19%;border:2px solid var(--c);border-radius:4px;background:color-mix(in srgb,var(--c) 10%,var(--card));display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6%}
.skin-pixel .card .court svg.crown{width:80%;height:auto}
.skin-pixel .card .court b{font-size:calc(var(--cw)*.3);line-height:1}
.skin-pixel .card.joker{--c:var(--card-dark)}
.skin-pixel .card.joker .idx{font-size:calc(var(--cw)*.11);line-height:1;gap:0}
.skin-pixel .card.joker .art{position:absolute;inset:12% 13% 10%;border-radius:6px;overflow:hidden;box-shadow:0 0 0 2px #2b2d42}
.skin-pixel .card.joker .art svg{width:100%;height:100%;display:block}
.skin-pixel .card.joker .art.px img{width:100%;height:100%;display:block;image-rendering:pixelated;object-fit:cover}
.skin-pixel .card.back{background:var(--card)}
.skin-pixel .card.back .lattice{position:absolute;inset:calc(var(--cw)*.06);border-radius:calc(var(--cw)*.06);background-color:#b8383d;background-image:linear-gradient(45deg,#9a2a30 25%,transparent 25%,transparent 75%,#9a2a30 75%),linear-gradient(45deg,#9a2a30 25%,transparent 25%,transparent 75%,#9a2a30 75%);background-size:8px 8px;background-position:0 0,4px 4px;box-shadow:inset 0 0 0 3px #7a1d22}
.skin-pixel .card.back .lattice::after{content:"";position:absolute;left:50%;top:50%;width:30%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:var(--gold);box-shadow:0 0 0 3px #7a1d22}
.skin-pixel .card.new{animation:deal .3s steps(5,end)}
@keyframes deal{from{transform:translateY(-36px) scale(.85);opacity:0}}
.skin-pixel .card.small{--cw:30px;height:42px;border-width:1.5px;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.skin-pixel .card.small .pips,.skin-pixel .card.small .court,.skin-pixel .card.small .art,.skin-pixel .card.small .br{display:none}
.skin-pixel .card.small .tl{left:0;right:0;top:10%;font-size:11px}
.skin-pixel .card.small .tl svg{width:8px}
.skin-pixel .card.small.joker .tl{font-size:5px}

/* ---------- cards: the classic deck, shared by the Classic, Neon and Sketch themes ---------- */
.skin-classic .card,.skin-neon .card,.skin-sketch .card{--c:#1b1b1b;width:var(--cw);height:calc(var(--cw)*1.4);border-radius:calc(var(--cw)*.09);background:#fffdf7;border:1px solid #cfc8b8;box-sizing:border-box;position:relative;flex:none;box-shadow:0 3px 8px rgba(0,0,0,.35);user-select:none;color:var(--c);font-family:"Libre Baskerville",Georgia,"Times New Roman",serif;overflow:hidden}
.skin-classic .card.red,.skin-neon .card.red,.skin-sketch .card.red{--c:#c4161c}
.skin-classic .card .idx,.skin-neon .card .idx,.skin-sketch .card .idx{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:.95;font-weight:700;font-size:calc(var(--cw)*.19);letter-spacing:-.04em;z-index:2}
.skin-classic .card .idx i,.skin-neon .card .idx i,.skin-sketch .card .idx i{font-style:normal;font-size:calc(var(--cw)*.16);letter-spacing:0}
.skin-classic .card .tl,.skin-neon .card .tl,.skin-sketch .card .tl{left:5%;top:4%}.skin-classic .card .br{right:5%;bottom:4%;transform:rotate(180deg)}
.skin-classic .card .pips,.skin-neon .card .pips,.skin-sketch .card .pips{position:absolute;inset:11% 21%}
.skin-classic .card .pips i,.skin-neon .card .pips i,.skin-sketch .card .pips i{position:absolute;font-style:normal;font-size:calc(var(--cw)*.2);line-height:1;transform:translate(-50%,-50%)}
.skin-classic .card .pips i.f,.skin-neon .card .pips i.f,.skin-sketch .card .pips i.f{transform:translate(-50%,-50%) rotate(180deg)}
.skin-classic .card .pips i.ace,.skin-neon .card .pips i.ace,.skin-sketch .card .pips i.ace{font-size:calc(var(--cw)*.55)}
.skin-classic .card .court,.skin-neon .card .court,.skin-sketch .card .court{position:absolute;inset:12% 18%;border:1.5px solid var(--c);border-radius:3px;background:linear-gradient(#fff6dd,#f3e3b6);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2%}
.skin-classic .card .court svg,.skin-neon .card .court svg,.skin-sketch .card .court svg{width:78%;height:auto}
.skin-classic .card .court b,.skin-neon .card .court b,.skin-sketch .card .court b{font-size:calc(var(--cw)*.3);line-height:1}
.skin-classic .card.joker .idx,.skin-neon .card.joker .idx,.skin-sketch .card.joker .idx{font-size:calc(var(--cw)*.11);letter-spacing:0;line-height:1.02}
.skin-classic .card.joker .art,.skin-neon .card.joker .art,.skin-sketch .card.joker .art{position:absolute;inset:11% 14% 9%;border-radius:5px;overflow:hidden;box-shadow:0 0 0 1.5px #2b2d42}
.skin-classic .card.joker .art svg,.skin-neon .card.joker .art svg,.skin-sketch .card.joker .art svg{width:100%;height:100%;display:block}
.skin-classic .card.back,.skin-neon .card.back,.skin-sketch .card.back{background:#fffdf7}
.skin-classic .card.back .lattice,.skin-neon .card.back .lattice,.skin-sketch .card.back .lattice{position:absolute;inset:calc(var(--cw)*.06);border-radius:calc(var(--cw)*.05);background-color:#8e1b22;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.22) 0 1.5px,transparent 1.5px 7px),repeating-linear-gradient(-45deg,rgba(255,255,255,.22) 0 1.5px,transparent 1.5px 7px);box-shadow:inset 0 0 0 2px #8e1b22,inset 0 0 0 3.5px rgba(255,255,255,.5)}
.skin-classic .card.back .lattice::after,.skin-neon .card.back .lattice::after,.skin-sketch .card.back .lattice::after{content:"";position:absolute;left:50%;top:50%;width:34%;aspect-ratio:1;transform:translate(-50%,-50%) rotate(45deg);background:#8e1b22;border:2px solid rgba(255,255,255,.6)}
.skin-classic .card.new,.skin-neon .card.new,.skin-sketch .card.new{animation:deal2 .35s ease-out}
@keyframes deal2{from{transform:translateY(-40px) rotate(-8deg) scale(.8);opacity:0}}
.skin-classic .card.small,.skin-neon .card.small,.skin-sketch .card.small{--cw:30px;height:42px}
.skin-classic .card.small .pips,.skin-classic .card.small .court,.skin-classic .card.small .art,.skin-classic .card.small .br,.skin-neon .card.small .pips,.skin-neon .card.small .court,.skin-neon .card.small .art,.skin-neon .card.small .br,.skin-sketch .card.small .pips,.skin-sketch .card.small .court,.skin-sketch .card.small .art,.skin-sketch .card.small .br{display:none}
.skin-classic .card.small .tl,.skin-neon .card.small .tl,.skin-sketch .card.small .tl{left:0;right:0;top:12%;font-size:11px}
.skin-classic .card.small .tl i,.skin-neon .card.small .tl i,.skin-sketch .card.small .tl i{font-size:11px}
.skin-classic .card.small.joker .tl,.skin-neon .card.small.joker .tl,.skin-sketch .card.small.joker .tl{font-size:5.5px}




/* ---------- Neon theme: synthwave arcade ---------- */

let cardBuf=null, cardLoading=false;
function loadCardSound(a){
  if(cardBuf||cardLoading||!a) return; cardLoading=true;
  try{ const bin=atob(CARD_MP3), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
    const done=b=>{ cardBuf=b; }, fail=()=>{ cardLoading=false; };
    const pr=a.decodeAudioData(u8.buffer,done,fail); if(pr&&pr.catch) pr.catch(fail);
  }catch(e){ cardLoading=false; }
}
function playCard(a,t,offset,rate,vol){
  const src=a.createBufferSource(); src.buffer=cardBuf; src.playbackRate.value=rate;
  const g=a.createGain(); g.gain.value=vol; src.connect(g).connect(a.destination); src.start(t,offset);
}
const SFX={
  /* a card is played: the recorded card sound (its snap lands about 0.2s in); each extra card in a set is pitched a step higher */
  play(delayMs=0,step=0){ const a=audio(); if(!a||!sfxOn||a.state!=='running') return;
    const t=a.currentTime+Math.max(0,delayMs/1000-.2);
    if(!cardBuf){ noise(a,t+.2,{freq:2600,freqEnd:1100,q:.7,gain:.5,attack:.006,decay:.085}); return; }
    playCard(a,t,.135,Math.pow(2,step*1.5/12)*(0.97+Math.random()*.06),.9); },
  /* a card taken from the deck or the pile: the whole recorded take, slide and snap */
  grab(delayMs=0){ const a=audio(); if(!a||!sfxOn||a.state!=='running') return; const t=a.currentTime+delayMs/1000;
    if(!cardBuf){ noise(a,t,{freq:3800,freqEnd:1700,q:.5,gain:.2,attack:.035,decay:.06}); noise(a,t+.085,{freq:4300,q:2.2,gain:.34,attack:.001,decay:.02}); return; }
    playCard(a,t,0,0.98+Math.random()*.04,.85); },
  /* chat message: a soft double pop */
  chat(){ const a=audio(); if(!a||!sfxOn||a.state!=='running') return; const t=a.currentTime+.01;
    tone(a,t,{f:880,fEnd:1100,type:'sine',gain:.11,dur:.07}); tone(a,t+.08,{f:1320,fEnd:1500,type:'sine',gain:.1,dur:.09}); },
  /* your turn: two soft rising chimes */
  turn(){ const a=audio(); if(!a||!sfxOn||a.state!=='running') return; const t=a.currentTime+.02;
    tone(a,t,{f:659,type:'triangle',gain:.12,dur:.16}); tone(a,t+.12,{f:988,type:'triangle',gain:.12,dur:.28}); tone(a,t+.12,{f:1976,type:'sine',gain:.03,dur:.2}); },
  /* you won the round: bright arpeggio into a shimmering chord */
  win(){ const a=audio(); if(!a||!sfxOn||a.state!=='running') return; const t=a.currentTime+.02;
    [523,659,784,1047].forEach((f,i)=>tone(a,t+i*.08,{f,type:'triangle',gain:.13,dur:.22}));
    [1047,1319,1568].forEach(f=>tone(a,t+.34,{f,type:'sine',gain:.07,dur:.8}));
    noise(a,t+.34,{freq:7000,q:.8,gain:.05,attack:.05,decay:.6}); },
  /* you called Balls and it was false: wah, wah, wah, waaah */
  falseBalls(){ const a=audio(); if(!a||!sfxOn||a.state!=='running') return; const t0=a.currentTime+.02;
    [[311,.26],[294,.26],[277,.26],[262,.9]].forEach(([f,d],i)=>{ const t=t0+i*.3;
      const o=a.createOscillator(); o.type='sawtooth'; o.frequency.setValueAtTime(f*1.03,t); o.frequency.linearRampToValueAtTime(f,t+.06);
      const lp=a.createBiquadFilter(); lp.type='lowpass'; lp.Q.value=6; lp.frequency.setValueAtTime(350,t); lp.frequency.linearRampToValueAtTime(1300,t+.08); lp.frequency.linearRampToValueAtTime(500,t+d);
      if(i===3){ const l=a.createOscillator(); l.frequency.value=6; const lg=a.createGain(); lg.gain.value=7; l.connect(lg).connect(o.frequency); l.start(t); l.stop(t+d+.05); }
      const g=a.createGain(); g.gain.setValueAtTime(.0001,t); g.gain.exponentialRampToValueAtTime(.16,t+.04); g.gain.setValueAtTime(.16,t+d-.08); g.gain.exponentialRampToValueAtTime(.0001,t+d);
      o.connect(lp).connect(g).connect(a.destination); o.start(t); o.stop(t+d+.05); }); },
  /* lost the round or the game: three falling soft notes */
  lose(){ const a=audio(); if(!a||!sfxOn||a.state!=='running') return; const t=a.currentTime+.02;
    [[392,.22],[311,.22],[262,.6]].forEach(([f,d],i)=>{ tone(a,t+i*.2,{f,type:'triangle',gain:.11,dur:d}); tone(a,t+i*.2,{f:f/2,type:'sine',gain:.05,dur:d}); }); },
  /* riffle shuffle */
  /* round start: the card-grab sound five times, like cards being dealt */
  shuffle(){ for(let i=0;i<5;i++) SFX.grab(i*220); }
};
/* which jingle this player hears when a round or game ends */
function outcomeJingle(st){
  const r=st.result; if(!r||!st.players.some(p=>p.id===me)) return;
  if(st.phase==='over'){ const champ=st.players.find(p=>!p.out); return champ&&champ.id===me ? SFX.win() : SFX.lose(); }
  if(r.winner===me) return SFX.win();
  if(r.falseB && r.caller===me) return SFX.falseBalls();
  SFX.lose();
}

/* ---- game server: the table runs on the server, so nobody can peek at hands or fake a move ----
   On when the page sets window.BALLS_SERVER (beta.html does) or after opening the page once with ?server=<url>
   (?server= with nothing after it switches it off again). Otherwise online tables use Firebase as before. */
const SERVER_URL=(()=>{
  /* order: ?server= test override (kept for this browser), then the page's own setting, then the live site default */
  let u='';
  try{ const q=new URLSearchParams(location.search).get('server'); if(q!==null){ if(q) localStorage.setItem('balls.server',q); else localStorage.removeItem('balls.server'); } u=localStorage.getItem('balls.server')||''; }catch(e){}
  u=u||window.BALLS_SERVER||(/(^|\.)pelgrim32\.github\.io$/.test(location.hostname)?'https://balls-server.pelgrim32.workers.dev':'');
  return u.replace(/\/+$/,'');
})();

/* heartbeat: a "ping" every 20 s; if no "pong" comes back the connection is dead even if the browser hasn't noticed */
let sockRetry=null, lastPong=0, beatTimer=null;
function sockHeartbeat(){
  clearInterval(beatTimer);

/* server times are moved onto this device's clock so countdowns line up */
function fixTimes(s){ for(const k of ['startAt','turnAt','revealAt','overAt','lastActAt','created']) if(typeof s[k]==='number') s[k]+=clockOff; return s; }
function serverSubscribe(code){
  roomCode=code; mode='online'; ref=null; S=null; firstSnap=true; lastSplash=null; seenHand.clear(); srvChat=[];
  store('balls.room',code); startChat(code); render();
}
function serverOpen(code,{create=false,tableMode='custom'}={}){
  return new Promise(resolve=>{
    let first=true, firstTries=0;
    const done=r=>{ if(first){ first=false; resolve(r); return true; } return false; };
    const go=()=>{
      clearTimeout(sockTimer);
      if(sock&&sock.readyState<=1) return;
      let ws; try{ ws=new WebSocket(SERVER_URL.replace(/^http/,'ws')+'/api/table/'+code); }catch(e){ sockWant=false; done({ok:false,msg:L('Could not reach the game server. Try again.','De spelserver is niet bereikbaar. Probeer het opnieuw.')}); return; }
      sock=ws; sockRetry=go;
      ws.onopen=()=>{
        sockTries=0; lastPong=Date.now(); sockHeartbeat();
        const hello={t:'hello',id:me,secret:mySecret,name:(acct?acct.name:myName).trim().slice(0,14),lang};
        if(acctToken) hello.token=acctToken;
        if(create&&first){ const std=tableMode==='standard', r=std?standardize(localRules()):localRules(); Object.assign(hello,{create:true,mode:std?'standard':'custom',rules:r,sum:std?L('Standard table','Standaardtafel'):rulesSum(r)}); }
        ws.send(JSON.stringify(hello));
      };
      ws.onmessage=e=>{
        if(ws!==sock) return;
        if(e.data==='pong'){ lastPong=Date.now(); return; }
        lastPong=Date.now();
        let m; try{ m=JSON.parse(e.data); }catch(x){ return; }
        if(m.t==='state'){ clockOff=Date.now()-(m.s.now||Date.now()); done({ok:true}); onServerState(fixTimes(m.s)); }
        else if(m.t==='err'){
          if(done({ok:false,code:m.code,msg:m.msg})){ sockWant=false; sock=null; ws.close(); }
          else if(['notfound','secret','started','full'].includes(m.code)){ sockWant=false; leaveTable(m.msg); }
          else toast(m.msg);
        }
        else if(m.t==='chat') srvChatPush([m.m]);
        else if(m.t==='chatlog') srvChatPush(m.list||[]);
        else if(m.t==='gone'){ sockWant=false; leaveTable(m.msg); }
        else if(m.t==='ach'&&m.user){ acct=m.user;
          const msgs=[...(m.poker||[]).map(k=>'♠ '+L('New poker hand: ','Nieuwe pokerhand: ')+((POKER.find(h=>h[0]===k)||[k,k])[1])+` (${pokerCount(acct)}/9)`),...(m.ids||[]).map(a=>'★ '+L('Achievement: ','Prestatie: ')+achName(a))];
          msgs.forEach((t,i)=>setTimeout(()=>toast(t),400+i*2200)); }
        else if(m.t==='record'&&m.user){ acct=m.user; (m.fresh||[]).forEach((a,i)=>setTimeout(()=>toast('★ '+L('Achievement: ','Prestatie: ')+achName(a)),5000+i*2200)); if(m.counted!==false) setTimeout(()=>toast(m.win?L(`+1 win · ${recordLine(acct)}`,`+1 gewonnen · ${recordLine(acct)}`):L(`Counted as a loss · ${recordLine(acct)}`,`Telt als verlies · ${recordLine(acct)}`)),2500); }
      };
      ws.onclose=()=>{
        if(ws!==sock) return;
        sock=null;
        /* a first connection that fails gets two quiet retries before we give up */
        if(first&&sockWant&&++firstTries<3){ sockTimer=setTimeout(go,600*firstTries); return; }
        if(done({ok:false,msg:L('Could not reach the game server. Try again.','De spelserver is niet bereikbaar. Probeer het opnieuw.')})){ sockWant=false; return; }
        if(!sockWant) return;
        if(++sockTries===3) toast(L('Lost the connection. Reconnecting…','Verbinding kwijt. Opnieuw verbinden…'));
        sockTimer=setTimeout(go,Math.min(8000,400*2**sockTries));
      };
    };
    sockWant=true; go();
  });
}
function onServerState(s){
  if(mode!=='online') return;
  if(!s.players.some(p=>p.id===me)){ sockWant=false; leaveTable(L('You are no longer at this table.','Je zit niet meer aan deze tafel.')); return; }

function srvChatPush(list){

function serverChat(){

function serverLobby(){

async function act(fn,intent){
  if(serverMode&&mode==='online'){
    if(!intent||!S) return;
    if(!sock||sock.readyState!==1){ toast(L('Not connected to the table yet. Reconnecting…','Nog niet verbonden met de tafel. Opnieuw verbinden…')); sockKick(); return; }
    sock.send(JSON.stringify({t:'act',...intent})); sel.clear(); render(); return;
  }
  if(busy||!S) return;
  const s=structuredClone(S);
  useRules(s);
  const err=fn(s);
  if(err){ toast(err); return; }
  if(intent&&(intent.a==='throw'||intent.a==='draw')) movedSelf(s,me);
  s.v=(s.v||0)+1;
  sel.clear();
  if(mode==='local'){ const pv=S; S=s; afterState(pv); return; }
  const prev=S; busy=true; S=s; afterState(prev);
  try{ await ref.set(s); }catch(e){ S=prev; render(); toast(e&&e.code==='invalid_argument'?L('You can only watch this table. Ask the owner to invite you as an editor.','Je kunt deze tafel alleen bekijken. Vraag de eigenaar om je als bewerker uit te nodigen.'):L('That move did not reach the table. Check your connection and try again.','Die zet kwam niet aan bij de tafel. Controleer je verbinding en probeer het opnieuw.')); }
  busy=false;
}

function afterState(prev){
  if(prev && S && mode==='online' && prev.host!==me && S.host===me) toast(L('The host left. You are the host now.','De host is weg. Jij bent nu de host.'));
  if(S && S.result && (S.phase==='reveal'||S.phase==='over') && lastSplash!==S.result.id){
    splash(); outcomeJingle(S); lastSplash=S.result.id;
  }
  const before = (prev && S && prev.phase==='play') ? snapRects() : null;
  render();
  syncListing();
  if(before) animateMove(prev,S,before);
  scheduleBots();
}

/* ---- motion ---- */
const reducedMotion = () => { try{ return matchMedia('(prefers-reduced-motion: reduce)').matches; }catch(e){ return false; } };
function rectOf(el,isCard){ if(!el) return null; const r=el.getBoundingClientRect(); return {x:r.left+r.width/2, y:r.top+r.height/2, w:r.width, h:r.height, card:isCard}; }
function snapRects(){
  const m={};
  document.querySelectorAll('[data-card]').forEach(el=>{ m['c:'+el.dataset.card]=rectOf(el,true); });
  document.querySelectorAll('.opp[data-pid]').forEach(el=>{ m['p:'+el.dataset.pid]=rectOf(el,false); });
  const d=document.querySelector('#b-deck .card:last-child'); if(d) m.deck=rectOf(d,true);
  const h=document.querySelector('.hand'); if(h) m.hand=rectOf(h,false);
  return m;
}
function fly(html,from,toEl,{delay=0,dur=480,toRect=null,fade=false}={}){
  const to = toEl ? rectOf(toEl,true) : toRect;
  if(!from||!to) return;
  const ref = document.querySelector('#b-deck .card:last-child');
  const w = to.card ? to.w : (ref ? ref.getBoundingClientRect().width : 70);
  const h = w*1.4;
  const wrap=document.createElement('div'); wrap.className='flyer';
  wrap.style.cssText=`width:${w}px;height:${h}px;--cw:${w}px;left:${to.x-w/2}px;top:${to.y-h/2}px`;
  wrap.innerHTML=html; document.body.appendChild(wrap);
  if(toEl) toEl.style.visibility='hidden';
  const s0 = from.card ? from.w/w : .32, s1 = to.card ? 1 : .32;
  const dx=from.x-to.x, dy=from.y-to.y, spin=(Math.random()*30-15);
  const finish=()=>{ wrap.remove(); if(toEl) toEl.style.visibility=''; };
  if(reducedMotion()||!wrap.animate){ finish(); return; }
  const a=wrap.animate([
    {transform:`translate(${dx}px,${dy}px) scale(${s0}) rotate(${spin}deg)`, opacity: from.card?1:.2},
    {transform:`translate(${dx*.45}px,${dy*.45 - 26}px) scale(${(s0+s1)/2*1.08}) rotate(${spin/2}deg)`, opacity:1, offset:.5},
    {transform:`translate(0,0) scale(${s1}) rotate(0deg)`, opacity: fade?0:1}
  ],{duration:dur,delay,easing:'cubic-bezier(.25,.8,.3,1)',fill:'both'});
  a.onfinish=finish; a.oncancel=finish;
}
function bubble(text,rect,kind,ms=2300){
  if(!rect) return;
  const b=document.createElement('div'); b.className='bubble '+(kind||'');
  if(kind==='say'&&typeof text==='object'){ const nb=document.createElement('b'); nb.textContent=text.n+': '; b.append(nb,document.createTextNode(text.t)); } else b.textContent=text;
  b.style.left=Math.min(Math.max(rect.x,70),innerWidth-70)+'px';
  b.style.top=(rect.y-rect.h/2+4)+'px';
  document.body.appendChild(b); setTimeout(()=>b.remove(),ms);
}
function animateMove(prev,cur,before){
  if(!cur||cur.phase!=='play'||prev.round!==cur.round) return;
  const after=(sel)=>document.querySelector(sel);
  // THROW: cards leave a hand and land in the throw spot
  if(prev.step==='throw' && cur.step==='draw'){
    const who=cur.players[cur.turn].id;
    cur.thrown.forEach((c,i)=>{
      const from = who===me ? before['c:'+c] : before['p:'+who];
      fly(cardHTML(c), from, after(`.mythrow [data-card="${c}"]`), {delay:i*80});
      SFX.play(i*80+420,i);
    });
    return;
  }
  // DRAW: a card goes from the deck or the last throw to the player; their throw slides onto the table
  if(prev.step==='draw' && cur.step==='throw' && cur.lastDraw){
    const ld=cur.lastDraw, who=ld.id;
    prev.thrown.forEach((c,i)=>fly(cardHTML(c), before['c:'+c], after(`.availrow [data-card="${c}"]`), {delay:i*60, dur:380}));
    const fromDeck = ld.src==='deck' || !ld.open;
    let card = ld.open;
    if(who===me && fromDeck){ const old=new Set(prev.hands[me]||[]); card=(cur.hands[me]||[]).find(c=>!old.has(c)); }
    const from = fromDeck ? before.deck : before['c:'+card];
    const faceHTML = (who===me || !fromDeck) && card ? cardHTML(card) : cardHTML('back');
    SFX.grab(120);
    const msg = fromDeck ? 'drew from the deck' : 'took '+label(card)+' from the last throw';
    if(who===me){
      const el=after(`.hand [data-card="${card}"]`);
      fly(faceHTML, from, el, {delay:120, dur:520});
      bubble((fromDeck?L('Drew ','Pakte '):L('Took ','Pakte '))+(card?label(card):L('a card','een kaart')), rectOf(after('.hand'),false), fromDeck?'bub-deck':'');
    } else {
      const chip=after(`.opp[data-pid="${who}"]`);
      fly(faceHTML, from, null, {delay:120, dur:560, toRect:rectOf(chip,false), fade:true});
      bubble(fromDeck?L('Drew from deck','Van de stapel'):L('Took ','Pakte ')+label(card), rectOf(chip,false), fromDeck?'bub-deck':'');
    }
  }
}

function iDriveBots(){ if(serverMode&&mode==='online') return false; return mode==='local' || (S && S.host===me); }
function scheduleBots(){
  if(!S||S.phase!=='play'||!iDriveBots()) return;
  useRules(S);
  const cur=S.players[S.turn]; if(!cur) return;
  if(!cur.bot&&!cur.left){ scheduleTimeout(cur); return; }
  const key=S.v+':'+S.turn+':'+S.step;
  if(botKey===key) return;
  botKey=key; clearTimeout(botTimer);
  botTimer=setTimeout(()=>{
    if(!S||S.phase!=='play') return;
    useRules(S);
    const c=S.players[S.turn]; if(!c||!(c.bot||c.left)) return;
    const lvl=c.bot?lvlOf(S,c):'normal';
    if(S.step==='throw'){
      if(botWantsBalls(S,c.id,lvl)) act(s=>doBalls(s,c.id));
      else { const h=S.hands[c.id]; const stuck=(S.turnsTaken[c.id]||0)>25 && Math.random()<.3; const t=stuck?[h[Math.floor(Math.random()*h.length)]]:botThrowFor(S,c.id,lvl); act(s=>doThrow(s,c.id,t)); }
    } else {
      const [src,card]=botDraw(S,c.id,lvl); act(s=>doDraw(s,c.id,src,card));
    }
  }, (S.step==='throw'?1000:750)*((SPEED[RULES.speed]||SPEED.normal).bot) + Math.max(0,(S.startAt||0)-Date.now()));
}
function scheduleTimeout(cur){
  if(!RULES.turnTimer) return;
  const key=S.round+':'+S.turn+':'+S.turnAt;
  if(autoKey===key) return;
  autoKey=key; clearTimeout(autoTimer);
  const due=(S.turnAt||Date.now())+RULES.turnTimer*1000+400-Date.now();
  autoTimer=setTimeout(()=>{
    if(!S||S.phase!=='play'||S.round+':'+S.turn+':'+S.turnAt!==key) return;
    const id=S.players[S.turn].id;
    act(s=>timeoutMove(s,id));
  }, Math.max(0,due));
}
function timeLeft(){ if(!S||S.phase!=='play'||!RULES.turnTimer||!roundLive(S)) return null; return Math.max(0,Math.ceil(((S.turnAt||0)+RULES.turnTimer*1000-Date.now())/1000)); }
setInterval(()=>{ const el=document.getElementById('tt'); if(!el) return; const t=timeLeft(); if(t===null){ el.hidden=true; return; } el.hidden=false; el.textContent=t+'s'; el.classList.toggle('low',t<=5); },250);

/* ---- local ---- */
function startLocal(){
  mode='local'; me='me'; seenHand.clear(); lastSplash=null; stopChat(); showInfo=false;
  const names=shuffle(BOT_NAMES).slice(0,botCount);
  const players=[{id:'me',name:myName||L('You','Jij'),score:0,out:false}, ...names.map((n,i)=>({id:'b'+i,name:n,score:0,out:false,bot:true}))];
  const rules=localRules(); const cn=cardsNeeded(rules,players.length);
  if(cn.need>cn.have){ mode=null; homeErr=L(`Not enough cards: ${players.length} players need ${cn.need}, the deck has ${cn.have}. Add a deck or deal fewer cards.`,`Niet genoeg kaarten: ${players.length} spelers hebben er ${cn.need} nodig, het spel heeft er ${cn.have}. Voeg een kaartspel toe of deel minder kaarten.`); render(); return; }
  S={v:1,phase:'play',host:'me',players,round:0,dealer:Math.floor(Math.random()*players.length),log:[],rules};
  useRules(S); S.v_round=0; startRound(S); afterState(null);
}

/* ---- online ---- */
function genCode(){ const A='ABCDEFGHJKLMNPQRSTUVWXYZ'; let c=''; for(let i=0;i<4;i++) c+=A[Math.floor(Math.random()*A.length)]; return c; }
function subscribe(code){
  if(unsub) unsub();
  roomCode=code; mode='online'; ref=db.doc('rooms/'+code); S=null; firstSnap=true; lastSplash=null; seenHand.clear();
  store('balls.room',code);
  startChat(code);
  render();
  clearTimeout(loadTimer);
  loadTimer=setTimeout(()=>{ if(!S){ toast(L('The table is not answering yet. Still trying…','De tafel reageert nog niet. We blijven het proberen…')); } },10000);
  unsub=ref.onSnapshot(snap=>{
    if(!snap.exists){ if(!snap.metadata.fromCache){ clearTimeout(loadTimer); leaveTable(L('That table no longer exists.','Die tafel bestaat niet meer.')); } return; }
    if(!snap.metadata.fromCache) clearTimeout(loadTimer);
    const d=snap.data();
    if(busy && S && (d.v||0)<S.v) return;
    if(S && (d.v||0)===S.v && !firstSnap) return;
    const pv=firstSnap?null:S;
    S=structuredClone(d);
    if(firstSnap && S.result) lastSplash=S.result.id;
    afterState(pv); firstSnap=false;
  }, err=>{ clearTimeout(loadTimer); leaveTable(L('Lost the connection to the table. Rejoin with the code.','Verbinding met de tafel verbroken. Doe opnieuw mee met de code.')); });
}

async function joinRoom(code){

  try{
    let lease={acquired:false};
    for(let i=0;i<6 && !lease.acquired;i++){ lease=await r.acquire({holder:me,ttlMs:4000}); if(!lease.acquired) await new Promise(res=>setTimeout(res,600)); }
    const snap=await r.get();
    if(!snap.exists){ homeErr=L(`No table with code ${code}.`,`Er is geen tafel met code ${code}.`); render(); return; }
    const d=structuredClone(snap.data());
    const already=d.players.some(p=>p.id===me);
    if(!already){
      if(d.phase!=='lobby'){ homeErr=L('That game has already started.','Dat spel is al begonnen.'); render(); return; }
      const mx=deriveRules(d.rules).maxPlayers; if(d.players.length>=mx){ homeErr=L(`That table is full (${mx} players).`,`Die tafel is vol (${mx} spelers).`); render(); return; }
      d.players.push({id:me,name:myName.trim(),score:0,out:false}); d.v=(d.v||0)+1;
      await r.set(d);
    }
    subscribe(code);
  }catch(e){ homeErr = e&&e.code==='invalid_argument' ? L('You can only view this page, so you cannot join. Ask the owner to invite you as an editor.','Je kunt deze pagina alleen bekijken, dus je kunt niet meedoen. Vraag de eigenaar om je als bewerker uit te nodigen.') : L('Could not join the table. Try again.','Meedoen lukte niet. Probeer het opnieuw.'); render(); }
}
let lastAllReady=null;
async function roomTxn(fn,r=ref){
  if(!r) return;
  let lease={acquired:false};
  for(let i=0;i<6&&!lease.acquired;i++){ lease=await r.acquire({holder:me,ttlMs:4000}); if(!lease.acquired) await new Promise(res=>setTimeout(res,400)); }
  const snap=await r.get(); if(!snap.exists) return;
  const d=structuredClone(snap.data()); if(fn(d)===false) return;
  d.v=(d.v||0)+1; await r.set(d);
}
function leaveTable(msg){
  if(serverMode){ const w=sock; sockWant=false; sock=null; sockRetry=null; clearTimeout(sockTimer); clearInterval(beatTimer); srvChat=[];
    if(w){ try{ if(w.readyState===1) w.send(JSON.stringify({t:'act',a:'leave'})); }catch(e){} setTimeout(()=>{ try{ w.close(); }catch(e){} },200); } }
  if(mode==='online'&&S&&ref){ const r=ref, id=me; roomTxn(d=>{
      const p=d.players.find(x=>x.id===id); if(!p) return false;
      if(d.host===id){ const nh=nextHost(d,id); if(nh){ d.host=nh; const q=d.players.find(x=>x.id===nh); if(q) q.ready=false; } }
      if(d.phase==='lobby') d.players=d.players.filter(x=>x.id!==id); else p.left=true;
    },r).catch(()=>{}); }
  lastAllReady=null;
  stopChat(); showInfo=false;
  if(S && S.host===me && listingSig && lobbyApi){ try{ lobbyApi.drop(S.code); }catch(e){} listingSig=null; }
  if(cdEl){ cdEl.remove(); cdEl=null; clearInterval(cdTimer); }
  if(unsub){unsub();unsub=null;} clearTimeout(botTimer); botKey=null;
  mode=null; S=null; ref=null; roomCode=null; homeErr=msg||''; store('balls.room',undefined); render(); refreshAcct();
}

function renderGame(){
  const myIdx=S.players.findIndex(p=>p.id===me);
  const meP=S.players[myIdx];
  const spectator=!meP;
  const order=[]; for(let k=1;k<S.players.length;k++) order.push(S.players[(Math.max(myIdx,0)+k)%S.players.length]);
  if(spectator) order.unshift(S.players[0]);
  const cur=S.players[S.turn]||{};
  const myTurn=S.phase==='play'&&roundLive(S)&&cur.id===me;
  const hand=meP&&S.hands[me]?sortHand(S.hands[me]):[];
  const hv=handVal(hand);
  const ballsOK=meP&&canCall(S,me);

  const newCards=[];

  const roundKey='r'+S.round;

  const rot=i=>((i*7)%11-5);

      <button class="icon" id="b-scores">${L('Scores','Stand')}</button>

    </div>
    <div class="opps">${order.map(p=>{

        <span class="nm">${nameHTML(p)}</span>

        <span class="cnt">${p.out?'':n+L(' cards',' kaarten')}</span>
        <span class="sc">${p.out?L('out','uit'):p.score+L(' pts',' pnt')}</span>${rankBadge(S,p.id)}
      </div>`;}).join('')}</div>
    <div class="feed" aria-live="polite">${(()=>{ const f=fmtLog((S.log||[]).slice(-1)[0]); return (f.who?'<b>'+esc(f.who)+'</b>':'')+esc(f.rest); })()}</div>
    <div class="table">
      <button class="infobtn" id="b-info" aria-label="${L('Card values and table rules','Kaartwaarden en tafelregels')}" aria-expanded="${showInfo}">i</button>
      ${showInfo?`<div class="infopop" role="dialog" aria-label="${L('Card values and table rules','Kaartwaarden en tafelregels')}">${infoHTML()}</div>`:''}
      <div class="stackwrap">
        <button class="deck ${drawStep&&!potato?'':'locked'}" id="b-deck" aria-label="${L('Draw from the deck','Pak van de stapel')}" ${drawStep&&!potato?'':'disabled'} style="border-radius:calc(var(--cw)*.09)">
          ${S.deck.length>2?cardHTML('back'):''}${S.deck.length>1?cardHTML('back'):''}${cardHTML('back',{cls:drawStep?'pick':''})}
        </button>
        <span class="cap">${L('Deck','Stapel')} · ${S.deck.length}</span>
      </div>
      <div class="stackwrap">
        <div class="availrow">${S.avail.map((c,i)=>{ const can=drawStep&&(!potato||c===potato); return cardHTML(c,{cls:(can?'pick':''),attrs:`${can?`data-take="${c}" `:''}data-card="${c}" style="--rot:${rot(i)}deg" ${can?'tabindex="0" role="button" aria-label="'+L('Take ','Pak ')+label(c)+'"':''}`}); }).join('')}</div>

      <span class="grow"></span>

    </div>
  </div>`;

  $('#b-scores').onclick=()=>{ showScores=true; render(); };
  $('#b-sound').onclick=()=>{ sfxOn=!sfxOn; store('balls.sfx',sfxOn?'1':'0'); render(); if(sfxOn) SFX.play(); };
  $('#b-chat').onclick=openChat;
  $('#b-info').onclick=()=>{ showInfo=!showInfo; render(); };
  $('#b-settings').onclick=()=>{ showSettings=true; render(); };
  $('#b-quit').onclick=()=>{ if(cdEl){ cdEl.remove(); cdEl=null; clearInterval(cdTimer); } if(mode==='online') leaveTable(); else { mode=null; S=null; clearTimeout(botTimer); botKey=null; render(); } };
  app.querySelectorAll('.hand [data-c]').forEach(el=>{
    const toggle=()=>{ if(!(myTurn&&S.step==='throw')) return; const c=el.dataset.c; sel.has(c)?sel.delete(c):sel.add(c); render(); };
    el.onclick=toggle; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle();} };
  });
  $('#b-throw').onclick=()=>{ const cs=[...sel]; act(s=>doThrow(s,me,cs),{a:'throw',cards:cs}); };
  $('#b-balls').onclick=()=>act(s=>doBalls(s,me),{a:'balls'});
  $('#b-deck').onclick=()=>{ if(drawStep&&!potato) act(s=>doDraw(s,me,'deck'),{a:'draw',src:'deck'}); };
  if(drawStep) app.querySelectorAll('[data-take]').forEach(el=>{
    const take=()=>act(s=>doDraw(s,me,'avail',el.dataset.take),{a:'draw',src:'avail',card:el.dataset.take});
    el.onclick=take; el.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){e.preventDefault();take();} };
  });
}

function readRulesForm(root,base){
  const r={...base};
  root.querySelectorAll('.rules-form [data-rule]').forEach(el=>{ const k=el.dataset.rule; r[k]= (k==='speed'||k==='botLevel')? el.value : +el.value; });
  for(const k of ['resetA','resetB']){ const on=root.querySelector(`#ru-${k}-on`), f=root.querySelector(`#ru-${k}-from`), t=root.querySelector(`#ru-${k}-to`);
    if(on) r[k]={on:on.checked, from:Math.round(+f.value||0), to:Math.round(+t.value||0)}; }
  const pub=root.querySelector('#ru-pub'); if(pub) r.pub=pub.checked;
  const an=root.querySelector('#ru-autoNext'); if(an) r.autoNext=an.checked;
  const hp=root.querySelector('#ru-hotPotato'); if(hp) r.hotPotato=hp.checked;
  delete r.resets; return r;
}
function wireRulesForm(root,base,onChange){
  root.querySelectorAll('.rules-form select, .rules-form input').forEach(el=>el.onchange=()=>onChange(readRulesForm(root,base)));
}
const youTag=p=>p.id===me&&p.name!==L('You','Jij')?L(' (you)',' (jij)'):'';
const lvlName=v=>({easy:L('Easy','Makkelijk'),normal:L('Normal','Normaal'),hard:L('Hard','Moeilijk')})[v]||v;
function rulesSummary(r){
  const R=deriveRules(r), d=deriveRules(null), diff=[];
  if(R.startHand!==d.startHand) diff.push(R.startHand+L(' cards',' kaarten'));
  if(R.decks!==d.decks) diff.push(R.decks+L(' decks',' spellen'));
  if(R.hotPotato) diff.push(L('hot potato','hete aardappel'));
  else if(R.jokers!==d.jokers) diff.push(R.jokers+L(' jokers/deck',' jokers/spel'));
  if(R.callMax!==d.callMax) diff.push(L('Balls at ','Balzak bij ')+R.callMax);
  if(R.falsePenalty!==d.falsePenalty) diff.push(L('false +','vals +')+R.falsePenalty);
  if(R.elimAt!==d.elimAt) diff.push(L('out at ','uit bij ')+R.elimAt);
  if(R.jokerVal!==d.jokerVal) diff.push('joker '+R.jokerVal);
  if(R.jackVal!==d.jackVal) diff.push(L('jack ','boer ')+R.jackVal);
  if(JSON.stringify(R.resets)!==JSON.stringify(d.resets)) diff.push(L('custom resets','eigen resets'));
  if(R.speed!=='normal') diff.push(R.speed==='fast'?L('fast','snel'):L('relaxed','rustig'));
  if(R.turnTimer) diff.push(R.turnTimer+L('s turns',' s per beurt'));
  if(!R.autoNext) diff.push(L('host deals','host deelt'));
  if(R.botLevel!=='normal') diff.push(L('bots: ','bots: ')+lvlName(R.botLevel).toLowerCase());
  return diff.length?L('Custom rules: ','Eigen regels: ')+diff.join(', '):L('Standard rules','Standaardregels');
}

function syncListing(){
  if(serverMode) return;
  if(!lobbyApi||mode!=='online'||!S||S.host!==me) return;
  const R=deriveRules(S.rules);
  if(S.phase==='lobby' && R.pub){
    const info={n:(S.players.find(p=>p.id===me)||{}).name||'Host', p:S.players.length, m:R.maxPlayers, s:rulesSummary(S.rules).replace(L('Custom rules: ','Eigen regels: '),'')};
    const sig=JSON.stringify(info);
    if(sig!==listingSig){ listingSig=sig; try{ lobbyApi.put(S.code,{...info,at:Date.now()}); }catch(e){} }
  } else if(listingSig){ listingSig=null; try{ lobbyApi.drop(S.code); }catch(e){} }
}
function startLobbyWatch(){
  if(!lobbyApi) return;
  try{ lobbyApi.watch(list=>{
    const now=Date.now();
    openTables=(list||[]).filter(t=>t&&/^[A-Z]{4}$/.test(t.code)&&now-(t.at||0)<2*3600e3&&(t.p||0)<(t.m||6)).sort((a,b)=>b.at-a.at).slice(0,20);
    const el=document.getElementById('open-list'); if(el){ el.innerHTML=openTablesHTML(); wireOpenTables(el); }
  }); }catch(e){}
}
function claudeLobby(db){
  return {
    watch(cb){ return db.collection('lobby').onSnapshot(q=>cb(q.docs.map(d=>({code:d.id,...d.data()}))),()=>{}); },
    put(code,info){ return db.doc('lobby/'+code).set(info); },
    drop(code){ return db.doc('lobby/'+code).delete(); }
  };
}

/* your own match in a few big numbers; everyone else's stats stay one tap away */
function statsHTML(){
  const meP=S.players.find(p=>p.id===me);
  if(!meP) return statsTableHTML();
  const st=(S.stats||{})[me]||{}, n=k=>st[k]||0, rounds=(S.history||[]).length;
  const place=(placings(S)[me]);
  const tile=(v,lab)=>`<div class="stile"><b>${v}</b><span>${lab}</span></div>`;
  return `<div class="stiles">
    ${tile(meP.out?L('out','uit'):(place?ordinal(place):'–'),L('Place','Plaats'))}
    ${tile(meP.score,L('Score','Score'))}
    ${tile(`${n('wins')}<small>/${rounds}</small>`,L('Rounds won','Rondes gewonnen'))}
    ${tile(n('played'),L('Cards played','Kaarten gespeeld'))}
    ${tile(n('balls'),L('Balls called','Balzak geroepen'))}
    ${tile(n('falseB'),L('False Balls','Valse Balzak'))}
  </div>
  <details class="allstats"><summary>${L('All players','Alle spelers')}</summary>${statsTableHTML()}</details>`;
}
function historyHTML(){
  const H=S.history||[]; if(!H.length) return '';
  const ps=S.players;
  return `<div class="histwrap"><table class="hist"><thead><tr><th>${L('Round','Ronde')}</th>${ps.map(p=>`<th title="${esc(p.name)}">${esc(p.name)}</th>`).join('')}</tr></thead><tbody>${H.map(h=>`<tr><th>${h.round}</th>${ps.map(p=>{ const c=h.rows&&h.rows[p.id]; if(!c) return `<td class="na">${L('out','uit')}</td>`;
      return `<td class="${h.winner===p.id?'w':''} ${c.out?'o':''}"><b>${c.after}</b><small>${c.gain>=0?'+':'−'}${Math.abs(c.gain)}${h.caller===p.id?(h.falseB?' ✗':' ★'):''}</small></td>`; }).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="note">${L('Each cell is the score after that round, with the points gained below. ★ called Balls · ✗ called false Balls · gold won the round · red was eliminated.','Elk vak toont de score na die ronde, met de punten van die ronde eronder. ★ riep Balzak · ✗ riep valse Balzak · goud won de ronde · rood lag eruit.')}</p>`;
}

/* ---- chat + reactions ---- */
const REACTS=['😂','😭','😡','👏','🔥','💀','🤡','🍀'];
let chatApi=null, chatUnsub=null, chatLog=[], chatSeen=new Set(), chatUnread=0, chatStart=0, chatLastSend=0;
function seatRect(id){
  const chip=document.querySelector(`.opp[data-pid="${CSS.escape(String(id))}"]`); if(chip) return rectOf(chip,false);
  if(id===me){ const h=document.querySelector('.hand'); if(h) return rectOf(h,false); }
  return {x:innerWidth/2,y:90,w:0,h:0};
}
function updateChatBadge(){ document.querySelectorAll('.chatbadge').forEach(b=>b.textContent=chatUnread||''); }
function chatLogHTML(){
  if(!chatLog.length) return `<p class="empty">${L('No messages yet. Say hi, or tap a reaction.','Nog geen berichten. Zeg hoi, of tik op een reactie.')}</p>`;
  return chatLog.map(m=>`<div class="${m.id===me?'me':''}"><b${m.dev?' class="devname"':''}>${esc(m.n||L('Someone','Iemand'))}${m.dev?devTag():''}:</b> ${esc(m.t)}</div>`).join('');
}
function refreshChatLog(){ const el=document.getElementById('chatlog'); if(el){ el.innerHTML=chatLogHTML(); el.scrollTop=el.scrollHeight; } }
function onChatMsg(m,live){
  if(!m||typeof m.t!=='string') return;
  const text=m.t.slice(0,140), open=!!document.getElementById('chatlayer');
  if(m.k==='r'){ if(live && REACTS.includes(text)) bubble(text,seatRect(m.id),'react'); return; }
  chatLog.push({id:m.id,n:String(m.n||'').slice(0,14),t:text,dev:!!m.dev}); if(chatLog.length>60) chatLog.shift();
  if(open) refreshChatLog();
  if(live && m.id!==me){ SFX.chat(); if(!open){ chatUnread++; updateChatBadge(); }
    bubble({n:m.n||L('Someone','Iemand'),t:text.length>80?text.slice(0,80)+'…':text},seatRect(m.id),'say',3000); }
}
function startChat(code){
  stopChat(); chatStart=Date.now();
  if(!chatApi) return;
  try{ chatUnsub=chatApi.watch(code,list=>{
    (list||[]).slice().sort((a,b)=>(a.at||0)-(b.at||0)).forEach(m=>{ if(chatSeen.has(m.key)) return; chatSeen.add(m.key); onChatMsg(m,(m.at||0)>chatStart-3000); });
  }); }catch(e){}
}
function stopChat(){ if(chatUnsub){ try{chatUnsub();}catch(e){} chatUnsub=null; } chatLog=[]; chatSeen=new Set(); chatUnread=0; closeChat(); }
function sendChat(k,t){
  t=String(t||'').trim().slice(0,140); if(!t) return false;
  const now=Date.now(); if(now-chatLastSend<500) return false; chatLastSend=now;
  const m={k,id:me,n:(myName||L('Player','Speler')).slice(0,14),t,at:now};
  if(mode==='online'&&chatApi){ Promise.resolve().then(()=>chatApi.send(roomCode,m)).catch(()=>toast(L('That message did not send. Check your connection.','Dat bericht is niet verstuurd. Controleer je verbinding.'))); }
  else onChatMsg({...m,key:'local'+now},true);
  if(k==='r'&&!(mode==='online'&&chatApi)) {/* shown by onChatMsg */}
  return true;
}
function openChat(){
  if(document.getElementById('chatlayer')) return;
  chatUnread=0; updateChatBadge();
  const el=document.createElement('div'); el.id='chatlayer';
  el.innerHTML=`<div class="sheet" role="dialog" aria-label="${L('Chat and reactions','Chat en reacties')}">
    <h3>Chat</h3>
    <div class="reacts" role="group" aria-label="${L('Reactions','Reacties')}">${REACTS.map(r=>`<button type="button" data-react="${r}" aria-label="${L('React','Reageer')} ${r}">${r}</button>`).join('')}</div>
    <div class="chatlog" id="chatlog" aria-live="polite">${chatLogHTML()}</div>
    ${mode==='online'?'':`<p class="note">${L('You are playing bots, so only you see this. Chat reaches everyone at online tables.','Je speelt tegen bots, dus alleen jij ziet dit. Aan online tafels ziet iedereen de chat.')}</p>`}
    <form id="chatform" class="row" style="flex-wrap:nowrap"><input class="txt" id="chat-in" maxlength="140" placeholder="${L('Say something','Zeg iets')}" autocomplete="off" aria-label="${L('Message','Bericht')}" style="flex:1;min-width:0"><button class="btn" type="submit">${L('Send','Versturen')}</button></form>
    <button class="btn ghost" id="b-chat-close" type="button">${L('Close','Sluiten')}</button></div>`;
  document.body.appendChild(el);
  const log=el.querySelector('#chatlog'); log.scrollTop=log.scrollHeight;
  el.onclick=e=>{ if(e.target===el) closeChat(); };
  el.querySelector('#b-chat-close').onclick=closeChat;
  el.querySelector('#chatform').onsubmit=e=>{ e.preventDefault(); const inp=el.querySelector('#chat-in'); if(sendChat('m',inp.value)) inp.value=''; inp.focus(); };
  el.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>{ if(sendChat('r',b.dataset.react)) closeChat(); });
}
function closeChat(){ const el=document.getElementById('chatlayer'); if(el) el.remove(); chatUnread=0; updateChatBadge(); }
function claudeChat(db){
  return {
    watch(code,cb){ return db.collection('rooms/'+code+'/chat').onSnapshot(q=>cb(q.docs.map(d=>({key:d.id,...d.data()}))),()=>{}); },
    send(code,m){ return db.doc('rooms/'+code+'/chat/'+m.at.toString(36)+Math.random().toString(36).slice(2,7)).set(m); }
  };
}

/* ---- after a finished game everyone goes back to the lobby ---- */
/* ---- rounds deal themselves after 5s (table rule, on by default), even if the host is away ---- */
let nextDone=null;
setInterval(()=>{
  if(!S||S.phase!=='reveal'||!S.result||!S.revealAt||!deriveRules(S.rules).autoNext) return;
  const left=Math.ceil((S.revealAt+NEXT_ROUND_MS-Date.now())/1000);
  const el=document.getElementById('next-left'); if(el) el.textContent=Math.max(0,left);
  if(left>0||nextDone===S.result.id||busy) return;
  const rid=S.result.id;
  if(mode==='local'){ nextDone=rid; act(s=>{ s.v_round=(s.v_round||0)+1; startRound(s); }); return; }
  if(mode!=='online'||!ref) return;
  /* host deals first; anyone else steps in 3s later if the host is gone */
  if(S.host!==me && left>-3) return;
  nextDone=rid;
  roomTxn(d=>{ if(d.phase!=='reveal'||!d.result||d.result.id!==rid) return false; useRules(d); d.v_round=(d.v_round||0)+1; startRound(d); })
    .catch(()=>{ nextDone=null; });
},500);
let overDone=null;
setInterval(()=>{
  if(!S||S.phase!=='over'||!S.overAt||!S.result) return;
  const left=Math.ceil((S.overAt+LOBBY_AFTER_MS-Date.now())/1000);
  const el=document.getElementById('over-left'); if(el) el.textContent=Math.max(0,left);
  if(left>0||overDone===S.result.id||busy) return;
  if(mode==='local'){ overDone=S.result.id; mode=null; S=null; clearTimeout(botTimer); botKey=null; render(); return; }
  if(S.host===me||left<=-6){ overDone=S.result.id; act(resetToLobby); }
},500);
/* shrink the cards until the whole table fits the window (any size, any number of players) */
let fitKey=null;
function clearFit(){ const root=document.documentElement; root.style.removeProperty('--cwfit'); root.classList.remove('compact','tiny'); fitKey=null; }
function fitCards(){
  const root=document.documentElement, scr=document.querySelector('#app .screen'), table=scr&&scr.querySelector('.table'), dock=scr&&scr.querySelector('.dock');
  if(!table||!dock){ clearFit(); return; }
  const key=[innerWidth,innerHeight,S?S.players.length:0,skin,hc].join('|');
  if(key!==fitKey){ clearFit(); fitKey=key; root.classList.toggle('compact',innerHeight<=640); root.classList.toggle('tiny',innerHeight<=440); }
  const fits=()=>{ const padB=parseFloat(getComputedStyle(scr).paddingBottom)||0;
    const need=Math.max(0,...[...table.querySelectorAll('.stackwrap')].map(e=>e.offsetHeight));
    return need<=table.clientHeight+1 && dock.getBoundingClientRect().bottom<=scr.getBoundingClientRect().bottom-padB+1; };
  const shrink=()=>{ const probe=table.querySelector('#b-deck .card'); let cw=(probe&&probe.getBoundingClientRect().width)||80;
    for(let i=0;i<70&&cw>34&&!fits();i++){ cw=Math.max(34,cw-3); root.style.setProperty('--cwfit',cw+'px'); } return cw; };
  let cw=shrink();
  if(cw<66&&!root.classList.contains('compact')){ root.classList.add('compact'); root.style.removeProperty('--cwfit'); cw=shrink(); }
  if(cw<50&&!root.classList.contains('tiny')){ root.classList.add('tiny'); root.style.removeProperty('--cwfit'); cw=shrink(); }
}
let fitT=null;
addEventListener('resize',()=>{ clearTimeout(fitT); fitT=setTimeout(()=>{ if(S&&mode&&S.phase!=='lobby') fitCards(); },80); });
try{ document.fonts.ready.then(()=>{ if(S&&mode&&S.phase!=='lobby'){ fitKey=null; fitCards(); } }); }catch(e){}

  <div class="row" style="justify-content:space-between;align-items:flex-start"><span style="padding-top:8px">${L('Theme','Thema')}</span><div class="seg wrap" role="group" aria-label="${L('Theme','Thema')}">${sb('data-skin','pixel',skin==='pixel',L('Pixelated','Pixel'))}${sb('data-skin','classic',skin==='classic',L('Classic','Klassiek'))}${sb('data-skin','uno',skin==='uno',L('Party','Feest'))}${sb('data-skin','neon',skin==='neon','Neon')}${sb('data-skin','sketch',skin==='sketch',L('Sketch','Schets'))}</div></div>

  root.querySelectorAll('[data-lang]').forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; store('balls.lang',lang); applyLang();

    render(); });
  root.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{ skin=b.dataset.skin; store('balls.skin',skin); applySkin(); applyHC(); render(); });
  root.querySelectorAll('[data-sfx]').forEach(b=>b.onclick=()=>{ sfxOn=b.dataset.sfx==='1'; store('balls.sfx',sfxOn?'1':'0'); render(); if(sfxOn){ const a=audio(); if(a&&a.state==='suspended') a.resume().then(()=>SFX.play()).catch(()=>{}); else SFX.play(); } });

let cdEl=null, cdTimer=null, cdRound=null;
function syncCountdown(){
  const live = !S || S.phase!=='play' || roundLive(S);
  const key = S ? S.round+':'+S.startAt : null;
  if(live){ if(cdEl && Date.now() > (S&&S.startAt||0)+700){ cdEl.remove(); cdEl=null; clearInterval(cdTimer); } return; }
  if(cdEl && cdRound===key) return;
  SFX.shuffle();
  if(cdEl){ cdEl.remove(); clearInterval(cdTimer); }
  cdRound=key;
  cdEl=document.createElement('div'); cdEl.className='countdown'; cdEl.setAttribute('role','status');
  const dealer=S.players[S.dealer]?S.players[S.dealer].name:'';
  const first=S.players[S.turn]?S.players[S.turn].name:'';
  cdEl.innerHTML=`<div class="cd-box"><div class="cd-round">${L('Round','Ronde')} ${S.round}</div><div class="cd-num" aria-live="assertive"></div><div class="cd-sub">${esc(dealer)} ${L('deals','deelt')} · ${S.players[S.turn]&&S.players[S.turn].id===me?L('you start','jij begint'):esc(first)+L(' starts',' begint')}</div></div>`;
  document.body.appendChild(cdEl);
  let last='';
  const tick=()=>{
    const left=(S.startAt||0)-Date.now();
    const txt = left>0 ? String(Math.ceil(left/1000)) : L('Go!','Start!');
    if(txt!==last){ const n=cdEl.querySelector('.cd-num'); n.textContent=txt; n.classList.remove('pop'); void n.offsetWidth; n.classList.add('pop'); last=txt; }
    if(left<=0){ clearInterval(cdTimer); render(); setTimeout(()=>{ if(cdEl&&cdRound===key){ cdEl.classList.add('out'); setTimeout(()=>{ if(cdEl&&cdRound===key){ cdEl.remove(); cdEl=null; } },300); } },650); }
  };
  tick(); cdTimer=setInterval(tick,100);
}
function scoreRows(){
  return S.players.slice().sort((a,b)=>(a.out-b.out)||(a.score-b.score)).map(p=>`<div class="rrow"><span class="who">${p.out?'':rankBadge(S,p.id)} ${nameHTML(p)}${youTag(p)}${p.out?`<span class="tagn bad">${L('out','uit')}</span>`:''}</span><span class="gain"></span><span class="tot">${p.score}</span></div>`).join('');
}

  const caller=pname(S,r.caller), win=pname(S,r.winner);
  const over=S.phase==='over';

  const canNext = mode==='local' || S.host===me;
  const head = over
    ? (champ&&champ.id===me ? L(`<h3><span class="hl">You</span> win the game!</h3>`,`<h3><span class="hl">Jij</span> wint het spel!</h3>`) : L(`<h3><span class="hl">${esc(champ?champ.name:'Nobody')}</span> wins the game!</h3>`,`<h3><span class="hl">${esc(champ?champ.name:'Niemand')}</span> wint het spel!</h3>`))

    : r.falseB
      ? `<h3><span class="hl">${L('False Balls!','Valse Balzak!')}</span> ${esc(caller)} ${L('called with','riep met')} ${r.cv}</h3><p class="sub">${L(`${esc(win)} tied or beat it and wins the round. ${esc(caller)} takes +${RULES.falsePenalty}.`,`${esc(win)} had evenveel of minder en wint de ronde. ${esc(caller)} krijgt +${RULES.falsePenalty}.`)}</p>`
      : L(`<h3>${esc(caller)} called <span class="hl">Balls</span> with ${r.cv}</h3><p class="sub">Lowest hand. ${esc(caller)} deals next round.</p>`,`<h3>${esc(caller)} riep <span class="hl">Balzak</span> met ${r.cv}</h3><p class="sub">Laagste hand. ${esc(caller)} deelt de volgende ronde.</p>`);
  layer.innerHTML=`<div class="overlay"><div class="sheet" role="dialog" aria-label="${L('Round result','Uitslag van de ronde')}">

    ${over?`<h4 class="sec">${L('Match summary','Samenvatting')}</h4>${statsHTML()}<h4 class="sec">${L('Round by round','Per ronde')}</h4>${historyHTML()}`:''}
    <div class="res" ${over?'hidden':''}>${r.rows.map(x=>`<div class="rrow ${x.id===r.winner?'win':''}">
      <span class="who">${rankBadge(S,x.id)} ${esc(pname(S,x.id))}${x.id===r.winner?`<span class="tagn">${L('round win','rondewinst')}</span>`:''}${x.notes.map(n=>`<span class="tagn ${n==='Eliminated'?'bad':''}">${esc(n==='Eliminated'?L('Eliminated','Uitgeschakeld'):n)}</span>`).join('')}</span>
      <span class="gain">${x.gain>=0?'+':''}${x.gain}</span>

    </div>`).join('')}</div>
    ${(canNext||over)
      ? `<button class="btn" id="b-next">${over?(mode==='local'?L('New game','Nieuw spel'):L('Back to lobby','Terug naar de lobby')):L('Deal next round','Volgende ronde delen')}</button>`
      : (RULES.autoNext?'':`<p class="note">${L(`Waiting for ${esc(pname(S,S.host))} to deal…`,`Wachten tot ${esc(pname(S,S.host))} deelt…`)}</p>`)}
    ${!over&&RULES.autoNext?`<p class="note" style="text-align:center">${L('Next round starts in','Volgende ronde begint over')} <b id="next-left">${Math.max(0,Math.ceil(((S.revealAt||Date.now())+NEXT_ROUND_MS-Date.now())/1000))}</b>s</p>`:''}
    ${over?`<p class="note" style="text-align:center">${mode==='online'?L('Back to the lobby in','Terug naar de lobby over'):L('Back to the menu in','Terug naar het menu over')} <b id="over-left">${Math.max(0,Math.ceil(((S.overAt||Date.now())+LOBBY_AFTER_MS-Date.now())/1000))}</b>s</p>`:''}
    ${over?`<button class="btn ghost" id="b-home">${mode==='online'?L('Leave table','Tafel verlaten'):L('Main menu','Hoofdmenu')}</button>`:''}
  </div></div>`;
  const nx=$('#b-next');
  if(nx) nx.onclick=()=>{
    if(over && mode==='local'){ startLocal(); return; }
    if(over){ act(resetToLobby,{a:'toLobby'}); return; }
    act(s=>{ s.v_round=(s.v_round||0)+1; startRound(s); },{a:'next'});
  };
  const hm=$('#b-home'); if(hm) hm.onclick=()=>{ if(mode==='online') leaveTable(); else { mode=null; S=null; render(); } };
}

const FB_VER='10.12.2';
function loadScript(srcs){
  return new Promise((res,rej)=>{
    const tryAt=i=>{ if(i>=srcs.length) return rej(new Error('load failed'));
      const el=document.createElement('script'); el.src=srcs[i]; el.async=true;
      el.onload=()=>res(); el.onerror=()=>{ el.remove(); tryAt(i+1); }; document.head.appendChild(el); };
    tryAt(0);
  });
}
async function firebaseDB(){
  try{
    const lib=n=>[`https://www.gstatic.com/firebasejs/${FB_VER}/${n}`,`https://cdn.jsdelivr.net/npm/firebase@${FB_VER}/${n}`];
    await loadScript(lib('firebase-app-compat.js'));
    await loadScript(lib('firebase-database-compat.js'));
    const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(FIREBASE_CONFIG);
    const rtdb = app.database();
    const wrapSnap = snap => { const v=snap.val(); let d=null; try{ d=v&&v.json?JSON.parse(v.json):null; }catch(e){}
      return { exists: !!d, data: ()=>d, metadata:{fromCache:false, hasPendingWrites:false} }; };
    return {
      lobby:{
        watch(cb){ const r=rtdb.ref('lobby'); const f=snap=>{ const v=snap.val()||{}; cb(Object.entries(v).map(([code,x])=>({code,...x}))); }; r.on('value',f,()=>{}); return ()=>r.off('value',f); },
        put(code,info){ return rtdb.ref('lobby/'+code).set(info); },
        drop(code){ return rtdb.ref('lobby/'+code).remove(); }
      },
      chat:{
        watch(code,cb){ const q=rtdb.ref('chat/'+code).limitToLast(40); const f=snap=>{ const v=snap.val()||{}; cb(Object.entries(v).map(([key,x])=>({key,...x}))); }; q.on('value',f,()=>{}); return ()=>q.off('value',f); },
        send(code,m){ return rtdb.ref('chat/'+code).push(m); }
      },
      doc(path){
        const r=rtdb.ref(path);
        return {
          path,
          set: data => r.set({json:JSON.stringify(data), v:data.v||0, at:Date.now()}),
          get: async () => wrapSnap(await r.get()),
          onSnapshot(next,err){
            const cb=snap=>next(wrapSnap(snap));
            r.on('value',cb,e=>err&&err({code:'unavailable',message:String(e&&e.message||e)}));
            return ()=>r.off('value',cb);
          },
          async acquire({holder,ttlMs=4000}){
            const lock=rtdb.ref(path+'_lock'); const now=Date.now();
            const t=await lock.transaction(cur=>(!cur||cur.exp<now||cur.holder===holder)?{holder,exp:now+ttlMs}:undefined);
            return {acquired:!!t.committed};
          }
        };
      }
    };
  }catch(e){ return null; }
}
